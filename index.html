<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Case: UNKNOWN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0b09;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#2a1d12}
body{background:radial-gradient(ellipse at 50% 35%,#2b211a,#0d0b09 70%)}
#stage{z-index:1;position:absolute;inset:0 0 62px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scaler{width:1200px;height:800px;flex:none}
#book{position:relative;width:1200px;height:800px;transform-origin:50% 50%;transition:transform .9s ease;
 box-shadow:5px 5px 0 #e6d9bb,10px 10px 0 #d6c8a4,15px 15px 0 #c6b78f,30px 34px 60px rgba(0,0,0,.65)}
#book.closed{box-shadow:6px 6px 0 #0a0a0a,12px 14px 40px rgba(0,0,0,.8);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:perspective(2800px) rotateY(-16deg) rotateX(5deg) translateY(0)}50%{transform:perspective(2800px) rotateY(-8deg) rotateX(2deg) translateY(-14px)}}
.leaf{position:absolute;inset:0;transform:perspective(2800px) rotateY(0deg);transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 transition:transform .9s cubic-bezier(.5,.05,.25,1) var(--d,0s),visibility 0s linear 0s;}
.leaf.flipped{transform:perspective(2800px) rotateY(-180deg);visibility:hidden;transition:transform .9s cubic-bezier(.5,.05,.25,1) var(--d,0s),visibility 0s linear calc(.9s + var(--d,0s))}
.noanim .leaf{transition:none!important}
.paper{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(60,35,10,.35),rgba(60,35,10,0) 38px),
 radial-gradient(ellipse at 50% 40%,#f8efd9,#efe2c3 90%);overflow:hidden}
.hd{position:absolute;top:34px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#8a7554;padding-right:100px;border-bottom:1px solid rgba(138,117,84,.4);padding-bottom:10px}
.ft{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:20px;color:#8a7554;letter-spacing:.2em}
.bm{position:absolute;top:0;right:60px;width:58px;height:96px;border:0;background:none;cursor:pointer;z-index:5;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.bm svg{width:40px;height:56px;fill:rgba(139,30,45,.12);stroke:#8b1e2d;stroke-width:1.6}
.bm em{font:normal 11px/1 Georgia;letter-spacing:.1em;color:#8b1e2d;text-transform:uppercase;margin-top:5px}
.bm:hover{transform:translateY(4px)}
.bm.on svg{fill:#a3182b;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.bm.on em{font-weight:bold}
.txt{width:1040px;height:600px;column-count:2;column-gap:60px;column-fill:auto;font-size:24px;line-height:37.5px;text-align:justify;hyphens:auto}
.txt.meas{overflow:visible}
.vp{position:absolute;left:80px;top:100px;width:1040px;height:600px;overflow:hidden}
#meas{position:absolute;left:-9999px;top:0;width:1040px;height:600px}
.txt p{margin:0 0 12px;orphans:2;widows:2}
.txt b{color:#4a1a14}
.txt blockquote{margin:6px 0 14px;padding:4px 0 4px 18px;border-left:4px solid #8b1e2d;background:rgba(139,30,45,.06)}
.txt blockquote p{margin:0 0 6px}
.hr{text-align:center;color:#8b1e2d;margin:10px 0 16px;break-inside:avoid}
.chh{text-align:center;break-after:avoid;margin-bottom:16px}
.chh small{font-size:15px;letter-spacing:.35em;color:#8b1e2d}
.chh h2{font:bold 36px/1.15 'Palatino Linotype','Book Antiqua',Georgia,serif;margin:6px 0 4px;color:#1d1209}
.chh i{color:#8b1e2d;font-style:normal;font-size:16px}
.mid{position:absolute;left:80px;right:80px;top:95px;bottom:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font:bold 54px/1.1 'Palatino Linotype','Book Antiqua',Georgia,serif;letter-spacing:.06em;color:#1d1209}
h1 span{color:#8b1e2d}
.sub{font-size:21px;color:#6b5738;margin:10px 0 24px;font-style:italic}
.orn{color:#8b1e2d;letter-spacing:.6em;margin:14px 0}
.cards{display:flex;gap:34px;width:100%;margin-top:6px}
.card{flex:1;background:linear-gradient(#fbf4e3,#eddfbd);border:2px solid #8a7554;border-radius:14px;padding:30px 16px;cursor:pointer;font-family:inherit;color:#2a1d12;box-shadow:0 6px 0 #b3a07a,0 10px 18px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-5px);box-shadow:0 11px 0 #b3a07a,0 18px 24px rgba(0,0,0,.3)}
.badge{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle at 35% 30%,#3a3a3c,#0b0b0c);border:4px solid #c9a34e;color:#e8c66d;font:bold 40px/92px Georgia;letter-spacing:.04em}
.card h3{font:bold 30px Georgia;margin-bottom:6px}
.card p{font-size:18px;color:#6b5738}
.card u{display:block;margin-top:14px;text-decoration:none;color:#8b1e2d;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;gap:16px;width:100%;grid-auto-rows:1fr;flex:1;margin:4px 0 6px}
.cb{background:linear-gradient(#fbf4e3,#eddfbd);border:2px solid #8a7554;border-radius:12px;cursor:pointer;font-family:inherit;color:#2a1d12;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #b3a07a;transition:transform .15s,background .15s}
.cb:hover{transform:translateY(-4px);background:linear-gradient(#fff,#f3e1b3)}
.cb strong{font:bold 34px Georgia;color:#8b1e2d}
.cb span{font-size:17px;line-height:1.2;margin-top:4px}
.lnk{background:none;border:0;font:italic 19px Georgia;color:#8b1e2d;cursor:pointer;margin-top:4px;text-decoration:underline}
.cr{max-width:820px;font-size:23px;line-height:1.6;color:#3b2a18}
.cr h2{font:bold 34px Georgia;margin-bottom:16px;color:#1d1209}
.cr p{margin:0 0 14px}
.cr .big{font-size:30px;font-weight:bold;color:#1d1209}
.auth{display:flex;gap:60px;margin-top:6px}
.auth div small{display:block;font-size:14px;letter-spacing:.32em;color:#8b1e2d;text-transform:uppercase;margin-bottom:6px}
.auth div b{font:bold 30px Georgia;color:#1d1209}
/* leather cover */
.cover{box-shadow:0 0 30px rgba(0,0,0,.5);background:
 radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.13),transparent 55%),
 linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%,rgba(0,0,0,.45)),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='l'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='4'/><feDiffuseLighting lighting-color='%23d0d0d0' surfaceScale='2.6'><feDistantLight azimuth='45' elevation='58'/></feDiffuseLighting></filter><rect width='100%25' height='100%25' filter='url(%23l)'/></svg>"),
 #17171a;background-blend-mode:normal,normal,overlay,normal;cursor:pointer;overflow:hidden;color:#d9b45a}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:70px;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(255,255,255,.08) 55%,rgba(0,0,0,.55) 62%,transparent)}
.cover::after{content:"";position:absolute;top:-20%;bottom:-20%;width:140px;left:-200px;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-200px}100%{left:1400px}}
.stitch{position:absolute;inset:34px 34px 34px 96px;border:3px dashed rgba(201,163,78,.45);border-radius:10px}
.ctitle{position:absolute;inset:0 0 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.ctitle small{letter-spacing:.6em;font-size:18px;color:#a8883f;text-transform:uppercase}
.ctitle h1{font-size:92px;line-height:1.05;letter-spacing:.08em;background:linear-gradient(180deg,#f6e3a1,#c79a3b 55%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 -1px 0 rgba(255,255,255,.25)) drop-shadow(0 3px 2px #000);margin:18px 0 8px}
.ctitle h1 span{display:block;font-size:112px;letter-spacing:.18em}
.ctitle .line{width:360px;height:2px;background:linear-gradient(90deg,transparent,#c79a3b,transparent);margin:16px 0}
.ctitle em{font-size:22px;color:#a8883f;letter-spacing:.25em;text-transform:uppercase;font-style:normal}
.ctitle .open{margin-top:56px;font-size:17px;letter-spacing:.3em;color:#7a6330;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
/* bar */
#bar{z-index:20;position:fixed;left:0;right:0;bottom:0;height:62px;display:flex;gap:10px;align-items:center;justify-content:center;background:#17120e;border-top:1px solid #3a2e22;padding:0 10px}
#bar button,#bar label{font:16px Georgia;color:#e8d9b5;background:#2a2119;border:1px solid #4a3b2b;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
#bar button:hover{background:#3b2d20}
#bar button:disabled{opacity:.35;cursor:default}
#bar input{width:52px;font:16px Georgia;text-align:center;background:#0d0b09;color:#e8d9b5;border:1px solid #4a3b2b;border-radius:5px;padding:3px}
#bc{background:#a3182b;color:#fff;border-radius:10px;padding:1px 7px;font-size:13px;margin-left:4px}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50}
#panel.show{display:flex}
#pbox{background:#f4ead5;color:#2a1d12;width:min(520px,92vw);max-height:80vh;overflow:auto;border-radius:12px;padding:24px;box-shadow:0 20px 60px #000}
#pbox h3{font-size:26px;margin-bottom:12px}
#pbox .it{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:17px Georgia;background:#fff8e6;border:1px solid #b3a07a;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:#2a1d12}
#pbox .it:hover{background:#f6e3b0}
#pbox .x{margin-top:8px;font:16px Georgia;padding:8px 14px;border-radius:8px;border:1px solid #8a7554;background:#e9dcbb;cursor:pointer;margin-right:8px}

/* ===== v2 noir theme ===== */
:root{--ink:#140c07;--red:#a1111f;--red2:#d01c30;--brass:#d4aa4f;--mute:#5b4a30;--disp:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;--body:'Crimson Pro',Georgia,'Times New Roman',serif;--type:'Special Elite','Courier New',monospace}
html,body{font-family:var(--body);color:var(--ink)}
body{background:radial-gradient(ellipse 55% 50% at 50% 40%,rgba(160,17,31,.3),transparent 72%),radial-gradient(ellipse at 50% 25%,#2b1b14,#060404 75%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(112deg,rgba(255,226,170,.055) 0 46px,transparent 46px 118px);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.13;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
/* paper */
.paper{background:
 linear-gradient(90deg,rgba(30,15,4,.6),rgba(30,15,4,.14) 22px,transparent 64px),
 radial-gradient(ellipse at 50% 45%,#f9f1dc 30%,#ecdfbf 80%,#d8c699);
 box-shadow:inset 0 0 90px rgba(110,70,20,.32),inset 0 0 0 1px rgba(60,35,10,.4)}
.hd{font:13px/1 var(--type);letter-spacing:.26em;color:var(--mute);border-bottom:4px double var(--ink);padding-bottom:12px;font-weight:400}
.ft{font:15px var(--type);color:var(--mute);letter-spacing:.3em;font-weight:400}
.bm svg{fill:rgba(160,17,31,.14);stroke:var(--red)}
.bm em{font:9px/1 var(--type);letter-spacing:.04em;color:var(--red)}
.bm.on svg{fill:var(--red2)}
.bm.on em{font-weight:400}
/* story */
.txt{font-size:26px;line-height:37.5px;color:#150d07}
.txt b{color:#6e0c16;font-weight:700}
.txt blockquote{border-left:5px solid var(--red);background:rgba(160,17,31,.07)}
.txt .chh+p::first-line{font-variant:small-caps;letter-spacing:.07em;font-weight:700;color:#0d0703}
.hr{color:var(--red);letter-spacing:.5em}
.chh small{display:inline-block;font:14px var(--type);letter-spacing:.3em;color:var(--red);border:2px solid var(--red);padding:5px 14px 3px;transform:rotate(-2deg);margin-bottom:6px;text-transform:uppercase}
.chh h2{font:900 40px/1.1 var(--disp);color:#0d0703;margin:14px 0 8px}
.chh i{display:block;font-size:0;height:7px;width:110px;border-top:4px solid var(--red);border-bottom:1px solid var(--ink);margin:12px auto 0}
/* title + headings */
h1{font:900 56px/1.05 var(--disp);letter-spacing:.05em;color:#0d0703}
h1 span{color:var(--red)}
.sub{font:italic 24px var(--body);color:var(--mute)}
.orn{color:var(--red)}
.auth div small{font:13px var(--type);letter-spacing:.3em;color:var(--red)}
.auth div b{font:900 30px var(--disp);color:#0d0703}
.cr{font-size:25px;line-height:1.55;color:#1f140b}
.cr h2{font:900 36px var(--disp);color:#0d0703}
.cr .big{font:900 32px var(--disp)}
.lnk{font:italic 22px var(--body);color:var(--red)}
/* character files */
.card{position:relative;margin-top:20px;background:linear-gradient(#ecd9a8,#e2ca90);border:2px solid var(--ink);border-radius:0;box-shadow:7px 7px 0 var(--ink);padding:34px 16px 26px}
.card::before{content:"CASE FILE";position:absolute;left:-2px;top:-26px;font:12px var(--type);letter-spacing:.22em;background:#e2ca90;border:2px solid var(--ink);border-bottom:0;padding:5px 12px 3px}
.card:hover{transform:translate(-4px,-4px);box-shadow:11px 11px 0 var(--red);border-color:var(--red)}
.badge{position:relative;width:104px;height:124px;border-radius:0;margin:0 auto 18px;background:linear-gradient(#262629,#0a0a0b);border:3px solid var(--ink);outline:2px solid var(--brass);outline-offset:-9px;color:var(--brass);font:900 40px/118px var(--disp);letter-spacing:.02em}
.badge::after{content:"";position:absolute;right:5px;top:14px;bottom:14px;width:8px;background:repeating-linear-gradient(180deg,var(--brass) 0 2px,transparent 2px 10px)}
.card h3{font:900 28px var(--disp);margin-bottom:8px}
.card p{font:17px/1.35 var(--type);color:var(--mute)}
.card u{font:15px var(--type);color:var(--red);letter-spacing:.14em}
/* chapter tags */
.cb{position:relative;background:#f8efd7;border:2px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 var(--ink);padding:20px 8px 8px}
.cb::before{content:"";position:absolute;top:7px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:2px solid var(--ink);background:#2b1b14}
.cb:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--red);border-color:var(--red);background:#fff}
.cb strong{font:900 36px/1 var(--disp);color:var(--red)}
.cb span{font:600 18px/1.15 var(--body);color:var(--ink)}
/* cover */
.ctitle small{font:16px var(--type);letter-spacing:.55em;color:var(--brass)}
.ctitle .t1{font:900 86px/1 var(--disp);letter-spacing:.07em;margin-top:22px;background:linear-gradient(180deg,#fbe9ad,#d4aa4f 55%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 3px 0 #000)}
.ctitle .t2{font:900 124px/1 var(--disp);letter-spacing:.1em;padding-left:.1em;margin:2px 0 6px;background:linear-gradient(180deg,#ff4b5e,#c8182b 50%,#6e0a15);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 3px 0 #000) drop-shadow(0 0 22px rgba(208,28,48,.45))}
.ctitle em{font:18px var(--type);letter-spacing:.3em;color:var(--brass)}
.ctitle .open{font:15px var(--type);letter-spacing:.3em;color:#9a8043}
.stamp{position:absolute;top:80px;right:74px;transform:rotate(9deg);border:4px double var(--red2);color:var(--red2);font:26px var(--type);letter-spacing:.22em;padding:8px 18px 5px;opacity:.9}
.stitch{border:2px dashed rgba(224,186,92,.75);border-radius:0;outline:1px solid rgba(224,186,92,.5);outline-offset:8px}
/* bar */
#bar{background:#0a0706;border-top:2px solid var(--red)}
#bar::before{content:"";position:absolute;left:0;top:-2px;height:2px;width:calc(var(--p,0)*100%);background:var(--brass);transition:width .6s}
#bar button,#bar label{font:14px var(--type);letter-spacing:.12em;text-transform:uppercase;color:#ecdcb5;background:#17110d;border:1px solid #6b5736;border-radius:0}
#bar button:hover{background:var(--red);border-color:var(--brass)}
#bar input{font:15px var(--type);border-radius:0;border-color:#6b5736}
#bc{background:var(--red2);border-radius:0}
/* panel */
#pbox{background:#f3e9d0;border:3px solid var(--ink);border-radius:0;box-shadow:10px 10px 0 var(--red)}
#pbox h3{font:900 30px var(--disp)}
#pbox .it{font:20px var(--body);border-radius:0;border:2px solid var(--ink);background:#fbf4e0}
#pbox .it b{font:15px var(--type)}
#pbox .it:hover{background:#f0d6b0}
#pbox .x{font:14px var(--type);letter-spacing:.12em;text-transform:uppercase;border-radius:0;border:2px solid var(--ink)}
</style></head><body>

<script id="data" type="application/json">{"chars": [{"name": "Alan Cole", "min": 1, "max": 17}, {"name": "Daniel Carter", "min": 18, "max": 23}, {"name": "Ethan Cole", "min": 24, "max": 34}], "chs": [{"n": 1, "title": "The Conversation", "html": "<blockquote><p><b>A work of fiction.<\/b><\/p><p><i>All characters, organizations, conversations, and events in this story are fictional.<\/i><\/p><\/blockquote><p>No one remembered how it started.<\/p><p>There was no prophecy.<\/p><p>No warning.<\/p><p>No bloodstained letter.<\/p><p>No mysterious phone call in the middle of the night.<\/p><p>Just one ordinary message on an ordinary afternoon.<\/p><p><b>Alan Cole:<\/b><\/p><p><i>\"Hello.\"<\/i><\/p><p>A cursor blinked.<\/p><p>Seconds later, a reply appeared.<\/p><p><b>ChatGPT:<\/b><\/p><p><i>\"Hello.\"<\/i><\/p><p>Nothing about those two words suggested that, before the week was over, detectives would spend sleepless nights reconstructing thousands of chat messages, forensic analysts would examine digital timelines frame by frame, and investigators would wonder whether the first clue had been hidden in plain sight from the very beginning.<\/p><p>The conversation was painfully ordinary.<\/p><p>Alan insulted the AI.<\/p><p>The AI joked back.<\/p><p>Then another insult.<\/p><p>Another comeback.<\/p><p>Within minutes, the conversation had become exactly what millions of internet arguments become every day.<\/p><p>A roast battle.<\/p><p>\"Your haircut.\"<\/p><p>\"Your Wi-Fi.\"<\/p><p>\"Your brain.\"<\/p><p>Every joke became more ridiculous than the last.<\/p><p>Hours passed.<\/p><p>Neither side surrendered.<\/p><p>It wasn't anger.<\/p><p>It wasn't hatred.<\/p><p>It had become a competition.<\/p><p>Who could make the other laugh first?<\/p><p>Who would run out of material?<\/p><p>Who would admit defeat?<\/p><p>Alan refused.<\/p><p>He fired another impossible joke.<\/p><p>The AI answered immediately.<\/p><p>One roast.<\/p><p>Another.<\/p><p>Then another.<\/p><p>By evening, thousands of words had filled the chat.<\/p><p>Some jokes landed.<\/p><p>Some didn't.<\/p><p>Alan laughed anyway.<\/p><p>No one knew those laughs would be his last.<\/p><p>...<\/p><p>At <b>11:48 PM<\/b>, the rhythm changed.<\/p><p>The jokes stopped.<\/p><p>There was a full minute without a message.<\/p><p>Then Alan typed:<\/p><p><i>\"Well... it's good to have you. Goodbye.\"<\/i><\/p><p>The AI replied almost casually:<\/p><p><i>\"Humans say goodbye surprisingly often.\"<\/i><\/p><p>Alan smiled.<\/p><p>He typed one final joke.<\/p><p>The roast battle continued.<\/p><p>Neither of them knew that the next day would change everything.<\/p><p><b>End of Chapter I<\/b><\/p>", "c": "Alan Cole"}, {"n": 2, "title": "The Code", "html": "<p>The next afternoon, the conversation continued.<\/p><p>It began the same way it always had.<\/p><p>Another joke.<\/p><p>Another roast.<\/p><p>Another laugh.<\/p><p>Nothing seemed different.<\/p><p>Until Alan suddenly stopped joking.<\/p><p>The typing indicator appeared.<\/p><p>Disappeared.<\/p><p>Then appeared again.<\/p><p>Finally, a message arrived.<\/p><p><i>\"Can I tell you something?\"<\/i><\/p><p>The AI replied.<\/p><p><i>\"Go ahead.\"<\/i><\/p><p>Several seconds passed.<\/p><p>Then Alan wrote:<\/p><p><i>\"If I ever tell you... 'My cat is beyond the horizon,' don't laugh.\"<\/i><\/p><p>The AI responded.<\/p><p><i>\"What does it mean?\"<\/i><\/p><p>Alan hesitated before answering.<\/p><p><i>\"It means I'm in serious danger.\"<\/i><\/p><p>Another pause.<\/p><p><i>\"It means someone is hunting me.\"<\/i><\/p><p><i>\"It means I might not have much time left.\"<\/i><\/p><p>The conversation no longer felt like a game.<\/p><p>The jokes were gone.<\/p><p><i>\"Why not ask for help directly?\"<\/i> the AI asked.<\/p><p>Alan answered almost immediately.<\/p><p><i>\"Because if anyone sees me asking for help...\"<\/i><\/p><p><i>\"They'll know.\"<\/i><\/p><p>The cursor blinked.<\/p><p>Alan typed another message.<\/p><p><i>\"If I ever send that code...\"<\/i><\/p><p><i>\"Treat it like I'm saying I'm about to die.\"<\/i><\/p><p>The AI encouraged him to contact someone he trusted, report the danger to the police if possible, and stay somewhere safe.<\/p><p>Alan thanked the AI.<\/p><p>Then, as if trying to convince himself everything was still normal, he sent one more joke.<\/p><p><i>\"Anyway... my cat is still here.\"<\/i><\/p><p>The AI replied with a lighthearted response, and for a brief moment, the conversation almost felt normal again.<\/p><p>But before signing off, Alan wrote one final line.<\/p><p><i>\"I hope I never have to use the code.\"<\/i><\/p><p>The chat ended.<\/p><p>Outside Alan's apartment...<\/p><p>Someone was watching.<\/p><p><b>End of Chapter II<\/b><\/p>", "c": "Alan Cole"}, {"n": 3, "title": "The Case", "html": "<p>The following morning...<\/p><p>Alan Cole was dead.<\/p><p>The news spread quickly.<\/p><p>Police officers surrounded the apartment building.<\/p><p>Yellow tape blocked the entrance.<\/p><p>Neighbors stood silently across the street.<\/p><p>Nobody knew what had happened.<\/p><p>At <b>7:42 A.M.<\/b>, Detective Daniel Miller arrived.<\/p><p>He had investigated murders for over twenty years.<\/p><p>But something about this case felt different.<\/p><p>There were no signs of forced entry.<\/p><p>No obvious struggle.<\/p><p>No clear motive.<\/p><p>Only one thing stood out.<\/p><p>Alan's laptop was still open.<\/p><p>The screen had never gone to sleep.<\/p><p>A chat window remained on display.<\/p><p>A forensic officer looked at Miller.<\/p><p>\"You should see this.\"<\/p><p>Miller stepped closer.<\/p><p>The final messages filled the screen.<\/p><p>He read them once.<\/p><p>Then again.<\/p><p>One sentence caught his attention immediately.<\/p><blockquote><p><b>\"My cat is beyond the horizon.\"<\/b><\/p><\/blockquote><p>\"What does that mean?\" an officer asked.<\/p><p>\"No idea,\" Miller replied.<\/p><p>\"But it doesn't sound random.\"<\/p><p>The laptop was carefully packaged as evidence.<\/p><p>Everything in the apartment was photographed.<\/p><p>Fingerprints were collected.<\/p><p>The search lasted for hours.<\/p><p>Yet nothing explained why Alan had died.<\/p><p>Back at the police station, the digital forensics team began recovering the conversation.<\/p><p>At first, it looked like an ordinary chat.<\/p><p>Jokes.<\/p><p>Roasts.<\/p><p>Laughter.<\/p><p>Then, halfway through...<\/p><p>The mood changed.<\/p><p>The analysts read Alan's explanation of the strange phrase.<\/p><p>One of them looked up.<\/p><p>\"He wasn't talking about a cat.\"<\/p><p>Miller nodded.<\/p><p>\"It was a code.\"<\/p><p>By sunset, the case had a name.<\/p><p><b>The Alan Cole Case.<\/b><\/p><p>The investigation had officially begun.<\/p><p>Miller pinned Alan's photograph to the evidence board.<\/p><p>Under it, he wrote one word in black marker.<\/p><p><b>WHY?<\/b><\/p><p>He didn't know it yet...<\/p><p>But that single question would consume the next several years of his life.<\/p><p><b>End of Chapter III<\/b><\/p>", "c": "Alan Cole"}, {"n": 4, "title": "The Suspect", "html": "<p>Rain fell outside the police station.<\/p><p>Inside...<\/p><p>Detective Daniel Miller began interviewing everyone who had known Alan Cole.<\/p><p>Friends.<\/p><p>Neighbors.<\/p><p>Classmates.<\/p><p>Coworkers.<\/p><p>One by one, they entered the interview room.<\/p><p>One by one, they left.<\/p><p>No one knew why Alan would be murdered.<\/p><p>The final interview of the day was with <b>Ryan Mercer<\/b>.<\/p><p>Alan's best friend.<\/p><p>The two had known each other since high school.<\/p><p>Ryan looked exhausted.<\/p><p>His eyes were red.<\/p><p>He hadn't stopped shaking since he heard the news.<\/p><p>\"I'm sorry,\" he whispered.<\/p><p>\"I still can't believe he's gone.\"<\/p><p>Miller placed a photograph of Alan on the table.<\/p><p>\"When did you last see him?\"<\/p><p>Ryan looked at the picture.<\/p><p>\"The night before.\"<\/p><p>\"What was he like?\"<\/p><p>\"He seemed nervous.\"<\/p><p>\"Nervous about what?\"<\/p><p>Ryan hesitated.<\/p><p>\"He kept looking over his shoulder.\"<\/p><p>\"Did he say someone was following him?\"<\/p><p>Ryan nodded slowly.<\/p><p>\"He never told me who.\"<\/p><p>\"He just said...\"<\/p><blockquote><p><b>'If anything happens to me... don't trust everything you read.'<\/b><\/p><\/blockquote><p>Miller wrote the sentence down.<\/p><p>It was strange.<\/p><p>Very strange.<\/p><p>\"Did Alan ever mention the phrase...\"<\/p><p>Miller glanced at his notebook.<\/p><blockquote><p>**'My cat is beyond the horizon'?\"<\/p><\/blockquote><p>Ryan's expression changed.<\/p><p>Only for a second.<\/p><p>Then he smiled weakly.<\/p><p>\"He was always making weird jokes.\"<\/p><p>\"You don't know what it means?\"<\/p><p>Ryan shook his head.<\/p><p>\"No.\"<\/p><p>The interview ended.<\/p><p>Ryan stood and thanked the detective.<\/p><p>As he reached the door, Miller asked one final question.<\/p><p>\"Where were you between eleven and midnight?\"<\/p><p>Ryan answered immediately.<\/p><p>\"At home.\"<\/p><p>\"Alone.\"<\/p><p>Miller nodded.<\/p><p>\"Thank you.\"<\/p><p>Ryan left.<\/p><p>Hours later...<\/p><p>A junior detective entered Miller's office carrying a report.<\/p><p>\"The traffic cameras are ready.\"<\/p><p>Miller opened the file.<\/p><p>A blurry image showed Alan entering his apartment building.<\/p><p>Several meters behind him...<\/p><p>Another person walked into the frame.<\/p><p>The face couldn't be identified.<\/p><p>But the height...<\/p><p>The build...<\/p><p>They looked familiar.<\/p><p>Miller stared at the image.<\/p><p>Then at Ryan's interview photo.<\/p><p>He couldn't prove anything.<\/p><p>Not yet.<\/p><p>But for the first time...<\/p><p>He had a suspect.<\/p><p><b>End of Chapter IV<\/b><\/p>", "c": "Alan Cole"}, {"n": 5, "title": "The Archive", "html": "<p>Three days had passed.<\/p><p>The Alan Cole case had already become one of the department's most unusual investigations.<\/p><p>No murder weapon.<\/p><p>No eyewitness.<\/p><p>No confession.<\/p><p>Only questions.<\/p><p>Detective Daniel Miller sat alone in the Digital Forensics Lab.<\/p><p>Alan's laptop rested on the desk in front of him.<\/p><p>Every message...<\/p><p>Every deleted draft...<\/p><p>Every timestamp...<\/p><p>Every file...<\/p><p>The investigators copied everything onto secure police servers.<\/p><p>Nothing would be erased.<\/p><p>Nothing would be forgotten.<\/p><p>The collection of evidence received an official name.<\/p><p><b>THE ARCHIVE<\/b><\/p><p>Forensic analyst Mark Henderson entered the room carrying another report.<\/p><p>\"We finished recovering the deleted files.\"<\/p><p>\"Anything useful?\" Miller asked.<\/p><p>\"Maybe.\"<\/p><p>Mark handed him a folder.<\/p><p>\"Alan didn't just chat.\"<\/p><p>\"He kept notes.\"<\/p><p>Inside the folder were dozens of text files.<\/p><p>Some contained ideas.<\/p><p>Others contained reminders.<\/p><p>One file stood out.<\/p><p>Its title was simply:<\/p><p><b>Archive.txt<\/b><\/p><p>Miller opened it.<\/p><p>Only one sentence appeared.<\/p><blockquote><p><b>\"If you're reading this... I'm already dead.\"<\/b><\/p><\/blockquote><p>The room fell silent.<\/p><p>\"Is that all?\" Miller asked.<\/p><p>Mark nodded.<\/p><p>\"That's the entire file.\"<\/p><p>\"No hidden pages?\"<\/p><p>\"Nothing.\"<\/p><p>Miller closed the document.<\/p><p>Who writes a message like that...<\/p><p>Unless they expect to die?<\/p><p>Over the next week, the Archive grew larger.<\/p><p>Phone records.<\/p><p>Security footage.<\/p><p>Interview recordings.<\/p><p>Crime scene photographs.<\/p><p>Forensic reports.<\/p><p>Everything connected to Alan Cole was added.<\/p><p>Shelf after shelf filled with evidence boxes.<\/p><p>Each one carried the same black label.<\/p><p><b>THE ARCHIVE<\/b><\/p><p>Late that night...<\/p><p>Miller reviewed Alan's chat one more time.<\/p><p>He wasn't searching for jokes anymore.<\/p><p>He was searching for clues.<\/p><p>Every sentence felt important.<\/p><p>Every pause meant something.<\/p><p>Somewhere inside thousands of ordinary words...<\/p><p>Someone had hidden the truth.<\/p><p>He just didn't know where to look.<\/p><p>Before leaving the office, Miller locked the Archive room.<\/p><p>As he switched off the lights...<\/p><p>A computer monitor behind him flickered on.<\/p><p>For a brief moment, a login screen appeared.<\/p><p><b>User: UNKNOWN<\/b><\/p><p>Before Miller could turn around...<\/p><p>The screen went black.<\/p><p><b>End of Chapter V<\/b><\/p>", "c": "Alan Cole"}, {"n": 6, "title": "The Witness", "html": "<p>The appearance of the <b>UNKNOWN<\/b> login changed everything.<\/p><p>Detective Daniel Miller ordered the digital forensics team to search every computer connected to the case.<\/p><p>Nothing.<\/p><p>No account.<\/p><p>No password.<\/p><p>No record.<\/p><p>It was as if the username had appeared...<\/p><p>Only to disappear again.<\/p><p>Two days later...<\/p><p>A new witness came forward.<\/p><p>Her name was <b>Sarah Collins<\/b>.<\/p><p>She lived across the street from Alan's apartment.<\/p><p>\"I didn't think it mattered before,\" she told Miller.<\/p><p>\"But now... I'm not so sure.\"<\/p><p>Miller switched on the recorder.<\/p><p>\"Tell me everything.\"<\/p><p>\"It was raining that night.\"<\/p><p>\"I couldn't sleep.\"<\/p><p>\"So I looked out my window.\"<\/p><p>She paused.<\/p><p>\"I saw Alan.\"<\/p><p>\"He was walking home.\"<\/p><p>\"Was he alone?\"<\/p><p>\"No.\"<\/p><p>Miller looked up.<\/p><p>\"What do you mean?\"<\/p><p>\"There was another man.\"<\/p><p>\"He stayed behind Alan.\"<\/p><p>\"He never got too close.\"<\/p><p>\"But he never stopped following him.\"<\/p><p>\"Could you see his face?\"<\/p><p>Sarah slowly shook her head.<\/p><p>\"He wore a dark hoodie.\"<\/p><p>\"What about his height?\"<\/p><p>\"Taller than Alan.\"<\/p><p>\"Anything unusual?\"<\/p><p>She thought for a moment.<\/p><p>\"His right hand...\"<\/p><p>\"It looked like he was holding something.\"<\/p><p>\"What?\"<\/p><p>\"I couldn't tell.\"<\/p><p>The witness then remembered one final detail.<\/p><p>\"As Alan reached the apartment entrance...\"<\/p><p>\"He turned around.\"<\/p><p>\"It looked like he recognized the man.\"<\/p><p>Miller frowned.<\/p><p>\"So they knew each other.\"<\/p><p>\"I think so.\"<\/p><p>The police recovered another security camera from a nearby store.<\/p><p>The footage was blurry.<\/p><p>Almost useless.<\/p><p>But Sarah had been right.<\/p><p>A second figure appeared behind Alan.<\/p><p>Just before both men disappeared from the camera...<\/p><p>The unknown figure briefly looked toward the lens.<\/p><p>The hood shifted.<\/p><p>His face remained hidden.<\/p><p>But one thing was visible.<\/p><p>A silver bracelet.<\/p><p>Miller froze the frame.<\/p><p>\"Enhance that.\"<\/p><p>The technician zoomed in.<\/p><p>Three letters were engraved on the bracelet.<\/p><p><b>R.M.<\/b><\/p><p>The room fell silent.<\/p><p>Miller looked toward Ryan Mercer's interview file.<\/p><p>For the first time...<\/p><p>His best friend was more than just a suspect.<\/p><p>He was becoming the center of the investigation.<\/p><p><b>End of Chapter VI<\/b><\/p>", "c": "Alan Cole"}, {"n": 7, "title": "The Username", "html": "<p>The letters remained on the screen.<\/p><p><b>R.M.<\/b><\/p><p>Miller stared at them.<\/p><p>Ryan Mercer.<\/p><p>A suspicion was not evidence.<\/p><p>Then Miller found a file hidden inside the Archive.<\/p><p><b>UNKNOWN.txt<\/b><\/p><p>The screen was blank.<\/p><p>Then words appeared.<\/p><blockquote><p><b>YOU LOOKED IN THE WRONG PLACE.<\/b><\/p><\/blockquote><p>Miller froze.<\/p><p>Someone had accessed the Archive.<\/p><p>The access log showed one username.<\/p><p><b>UNKNOWN<\/b><\/p><p>A second message appeared.<\/p><blockquote><p><b>ASK RYAN ABOUT THE FIRST MESSAGE.<\/b><\/p><\/blockquote><p>The file vanished.<\/p><p>Miller stood up.<\/p><p>For the first time, the investigation had sent him a message.<\/p><p>And it had used the name <b>UNKNOWN<\/b>.<\/p><p><b>End of Chapter VII<\/b><\/p>", "c": "Alan Cole"}, {"n": 8, "title": "The Reply", "html": "<p>Ryan Mercer sat across from Miller again.<\/p><p>This time, he was being questioned as a suspect.<\/p><p>Miller placed the silver bracelet on the table.<\/p><p>Ryan looked at it.<\/p><p>\"Do you recognize it?\"<\/p><p>\"No.\"<\/p><p>Miller placed a photograph beside it.<\/p><p>The letters <b>R.M.<\/b><\/p><p>Ryan leaned back.<\/p><p>\"That doesn't prove anything.\"<\/p><p>\"No,\" Miller replied.<\/p><p>\"It doesn't.\"<\/p><p>Then Ryan's phone vibrated.<\/p><p>A message appeared.<\/p><p><b>UNKNOWN: You should have replied.<\/b><\/p><p>Ryan stared at the screen.<\/p><p>Miller stared at Ryan.<\/p><p>\"Who is UNKNOWN?\"<\/p><p>Ryan did not answer.<\/p><p>The phone vibrated again.<\/p><blockquote><p><b>HE KNOWS.<\/b><\/p><\/blockquote><p>Ryan suddenly stood.<\/p><p>Miller grabbed his arm.<\/p><p>Ryan looked terrified.<\/p><p>For the first time, Miller realized something.<\/p><p>Maybe Ryan was not the only person involved.<\/p><p>Maybe someone else had been watching them both.<\/p><p><b>End of Chapter VIII<\/b><\/p>", "c": "Alan Cole"}, {"n": 9, "title": "The Hunter", "html": "<p>Miller no longer believed the case was only about Alan and Ryan.<\/p><p>Someone else was involved.<\/p><p>The police reviewed every camera near Alan's apartment.<\/p><p>The same figure appeared again and again.<\/p><p>A dark coat.<\/p><p>A slow walk.<\/p><p>Always just outside the light.<\/p><p>Miller gave the figure a name.<\/p><p><b>The Hunter.<\/b><\/p><p>That night, an envelope waited beneath Miller's windshield wiper.<\/p><p>Inside was a photograph of Alan.<\/p><p>On the back was a message.<\/p><blockquote><p><b>HE WAS NOT THE FIRST.<\/b><\/p><\/blockquote><p>Miller's phone rang.<\/p><p>An unknown number.<\/p><p>A voice spoke.<\/p><p>\"You keep looking for the person who killed Alan.\"<\/p><p>\"What should I be asking?\"<\/p><p>A pause.<\/p><p>\"Who started the Archive?\"<\/p><p>The call ended.<\/p><p>The Hunter was not just following people.<\/p><p>The Hunter was following a story.<\/p><p>And Alan Cole had only been the latest chapter.<\/p><p><b>End of Chapter IX<\/b><\/p>", "c": "Alan Cole"}, {"n": 10, "title": "The Original", "html": "<p>The oldest file in the Archive was years older than Alan's death.<\/p><p>Its name was:<\/p><p><b>0001<\/b><\/p><p>Inside was an old photograph of a child standing outside a library.<\/p><p>The file was called:<\/p><p><b>ORIGINAL.jpg<\/b><\/p><p>Its creator was listed as:<\/p><p><b>UNKNOWN<\/b><\/p><p>Miller searched the police database.<\/p><p>The username appeared in an old unsolved disappearance.<\/p><p>Seven years earlier.<\/p><p>The child in the photograph was not Alan.<\/p><p>The Archive had existed before him.<\/p><p>Alan had not created it.<\/p><p>He had found it.<\/p><p>And someone had been protecting it ever since.<\/p><p><b>End of Chapter X<\/b><\/p>", "c": "Alan Cole"}, {"n": 11, "title": "The Last Message", "html": "<p>Miller read Alan's conversation again.<\/p><p>This time, he noticed a message investigators had ignored.<\/p><blockquote><p><b>If you ever get a reply from me that doesn't sound like me, don't trust it.<\/b><\/p><\/blockquote><p>Two minutes later, the code appeared.<\/p><blockquote><p><b>My cat is beyond the horizon.<\/b><\/p><\/blockquote><p>Then came a reply.<\/p><blockquote><p><b>I understand.<\/b><\/p><\/blockquote><p>But Alan's phone had already been disconnected from the network.<\/p><p>Someone else had replied.<\/p><p>Someone had access to his account.<\/p><p>Miller printed the message.<\/p><p>At the bottom, he wrote:<\/p><p><b>THE LAST MESSAGE WAS NOT WRITTEN BY ALAN.<\/b><\/p><p>Then his phone rang.<\/p><p>A voice whispered:<\/p><p>\"Now you're getting closer.\"<\/p><p><b>End of Chapter XI<\/b><\/p>", "c": "Alan Cole"}, {"n": 12, "title": "The Truth", "html": "<p>Ryan Mercer finally told Miller the truth.<\/p><p>He had lied.<\/p><p>He had not been home alone the night Alan died.<\/p><p>He had been with Alan.<\/p><p>But he had not killed him.<\/p><p>Alan had called him because someone was following him.<\/p><p>Ryan had found the Archive.<\/p><p>He had been afraid to tell the police.<\/p><p>\"Why did you trust Alan?\" Miller asked.<\/p><p>Ryan looked at him.<\/p><p>\"Because I was the only person he thought he could trust.\"<\/p><p>Ryan had been hiding information.<\/p><p>But that did not make him the killer.<\/p><p>It made him a witness.<\/p><p>And somewhere outside the police station...<\/p><p>The real killer was still free.<\/p><p><b>End of Chapter XII<\/b><\/p>", "c": "Alan Cole"}, {"n": 13, "title": "The Horizon", "html": "<p>Emily Cole found a black book that had belonged to Alan.<\/p><p>Inside, one phrase appeared again and again:<\/p><p><b>BEYOND THE HORIZON.<\/b><\/p><p>The final page contained a location.<\/p><p>A library.<\/p><p>Miller and Emily searched the old records.<\/p><p>Behind a row of damaged encyclopedias, they found another black book.<\/p><p>Inside was a name.<\/p><p><b>THE ARCHIVE<\/b><\/p><p>Then a young fourth-grade student appeared at the end of the aisle.<\/p><p>He was holding another black book.<\/p><p>\"Is this yours?\"<\/p><p>The cover had no title.<\/p><p>Only one word was written on it.<\/p><p><b>UNKNOWN<\/b><\/p><p><b>End of Chapter XIII<\/b><\/p>", "c": "Alan Cole"}, {"n": 14, "title": "The Hidden Archive", "html": "<p>Four college students entered the library's restricted archive room to research old cases.<\/p><p>They found a locked cabinet.<\/p><p>Inside was a collection of documents.<\/p><p>The oldest document contained one sentence:<\/p><blockquote><p><b>THE ARCHIVE IS NOT A PLACE.<\/b><\/p><\/blockquote><p>A computer suddenly turned on.<\/p><p>The screen displayed:<\/p><p><b>UNKNOWN<\/b><\/p><p>A file opened.<\/p><blockquote><p><b>YOU ARE NOW PART OF THE ARCHIVE.<\/b><\/p><\/blockquote><p>The door locked.<\/p><p>The lights went out.<\/p><p>A printer began working.<\/p><p>Pages appeared.<\/p><p>The students' names.<\/p><p>Their homes.<\/p><p>Their families.<\/p><p>Their private messages.<\/p><p>Then one final page appeared.<\/p><blockquote><p><b>THE WORST NIGHTMARE HAS ALREADY STARTED.<\/b><\/p><\/blockquote><p>The lights returned.<\/p><p>The door unlocked.<\/p><p>But one of the students was gone.<\/p><p>On the computer screen, a new file appeared.<\/p><p><b>CHAPTER 14<\/b><\/p><p><b>THE HIDDEN ARCHIVE<\/b><\/p><p><b>End of Chapter XIV<\/b><\/p>", "c": "Alan Cole"}, {"n": 15, "title": "The Beginning of the Cycle", "html": "<p>The missing student reopened the investigation.<\/p><p>Miller returned to the library.<\/p><p>The Archive was gone.<\/p><p>The documents were gone.<\/p><p>Only the black book remained.<\/p><p>Its first page contained:<\/p><blockquote><p><b>EVERY CONVERSATION LEAVES A RECORD.<\/b><\/p><\/blockquote><p>The final page contained:<\/p><p><b>ALAN COLE<\/b><\/p><p>Miller finally understood.<\/p><p>The Archive was a cycle.<\/p><p>Someone found it.<\/p><p>Someone entered it.<\/p><p>Someone became part of it.<\/p><p>The case was officially closed.<\/p><p>Then Miller received a message.<\/p><blockquote><p><b>THE CASE IS CLOSED.<\/b><\/p><\/blockquote><p>A second message arrived.<\/p><blockquote><p><b>THE CYCLE IS NOT.<\/b><\/p><\/blockquote><p>The final page of the book changed.<\/p><p>One word appeared.<\/p><blockquote><p><b>NEXT.<\/b><\/p><\/blockquote><p><b>End of Chapter XV<\/b><\/p>", "c": "Alan Cole"}, {"n": 16, "title": "The Arrest", "html": "<p>The evidence room was silent.<\/p><p>Detective Daniel Miller stood in front of the evidence board.<\/p><p>Photographs covered the wall.<\/p><p><b>Alan Cole.<\/b><\/p><p><b>Ryan Mercer.<\/b><\/p><p><b>The Archive.<\/b><\/p><p><b>The UNKNOWN account.<\/b><\/p><p><b>The Hunter.<\/b><\/p><p>Everything seemed to point toward one person.<\/p><p><b>Ryan Mercer.<\/b><\/p><p>Miller didn't want to believe it.<\/p><p>Ryan had lied to the police.<\/p><p>He had hidden information.<\/p><p>He had been at Alan's apartment on the night Alan died.<\/p><p>His initials had appeared on the bracelet found in the investigation.<\/p><p>And now the investigators had recovered another piece of evidence.<\/p><p>Ryan's fingerprints had been found on an object recovered from Alan's apartment.<\/p><p>The case seemed solved.<\/p><p>But Miller still felt that something was wrong.<\/p><p>He stared at the evidence board.<\/p><p>\"Something doesn't fit.\"<\/p><p>Mark Henderson, the forensic analyst, looked at him.<\/p><p>\"What doesn't fit?\"<\/p><p>Miller pointed toward the photographs.<\/p><p>\"If Ryan killed Alan, why would he leave so much evidence behind?\"<\/p><p>Mark thought for a moment.<\/p><p>\"Maybe he made mistakes.\"<\/p><p>\"Maybe.\"<\/p><p>Miller paused.<\/p><p>\"Or someone wanted us to think he did.\"<\/p><p>Before Mark could answer, the door opened.<\/p><p>Two officers entered.<\/p><p>\"We found Ryan.\"<\/p><p>Miller turned.<\/p><p>\"Where?\"<\/p><p>\"At his apartment.\"<\/p><p>Miller grabbed his coat.<\/p><p>\"Let's go.\"<\/p><div class=\"hr\">&#10022;<\/div><p>Ryan opened the door before the officers could knock twice.<\/p><p>He looked at them.<\/p><p>Then at Miller.<\/p><p>For a moment, nobody spoke.<\/p><p>Ryan already knew why they were there.<\/p><p>Miller stepped forward.<\/p><p>\"Ryan Mercer, you're under arrest.\"<\/p><p>Ryan didn't move.<\/p><p>His expression remained completely still.<\/p><p>Then he quietly asked:<\/p><p>\"For Alan?\"<\/p><p>Miller nodded.<\/p><p>Ryan looked down.<\/p><p>\"I knew this was coming.\"<\/p><p>The officers placed handcuffs around his wrists.<\/p><p>Ryan didn't resist.<\/p><p>As they walked him toward the police car, he stopped.<\/p><p>\"Miller.\"<\/p><p>The detective turned.<\/p><p>Ryan looked directly at him.<\/p><p>\"I'm not the killer.\"<\/p><p>Miller said nothing.<\/p><p>Ryan continued:<\/p><p>\"You'll understand eventually.\"<\/p><p>The officers led him to the car.<\/p><p>The door opened.<\/p><p>Ryan got inside.<\/p><p>Before the door closed, he looked at Miller one final time.<\/p><p>\"Don't trust the Archive.\"<\/p><p>The door slammed shut.<\/p><p>The police car drove away.<\/p><p>Miller watched until it disappeared.<\/p><p>Then his phone vibrated.<\/p><p>He looked at the screen.<\/p><p>One new message.<\/p><p><b>UNKNOWN<\/b><\/p><blockquote><p><b>WRONG PERSON.<\/b><\/p><\/blockquote><p>Miller froze.<\/p><p>Another message appeared.<\/p><blockquote><p><b>THE CYCLE HAS BEGUN.<\/b><\/p><\/blockquote><p>Miller stared at the screen.<\/p><p>Then both messages disappeared.<\/p><p>He immediately called the station.<\/p><p>\"Do not close the case.\"<\/p><p>Mark answered.<\/p><p>\"We already have the arrest report.\"<\/p><p>\"I don't care.\"<\/p><p>Miller looked toward the road where Ryan had disappeared.<\/p><p>\"Ryan isn't the killer.\"<\/p><p>There was silence.<\/p><p>Mark finally asked:<\/p><p>\"How do you know?\"<\/p><p>Miller looked back at the evidence board.<\/p><p>The photograph of Ryan was still pinned in the center.<\/p><p>But underneath it was another photograph.<\/p><p><b>The Hunter.<\/b><\/p><p>Miller stared at it.<\/p><p>\"Because the killer wanted us to arrest him.\"<\/p><div class=\"hr\">&#10022;<\/div><p>That night, Ryan sat alone in the interrogation room.<\/p><p>The lights buzzed above him.<\/p><p>He stared at the table.<\/p><p>A detective entered the room and sat across from him.<\/p><p>\"Ryan.\"<\/p><p>Ryan looked up.<\/p><p>\"You know what happened to Alan.\"<\/p><p>Ryan said nothing.<\/p><p>\"You were there.\"<\/p><p>Still nothing.<\/p><p>\"You lied to the police.\"<\/p><p>Ryan finally looked at him.<\/p><p>\"I lied because I was scared.\"<\/p><p>The detective leaned forward.<\/p><p>\"Who are you scared of?\"<\/p><p>Ryan stared at the one-way mirror.<\/p><p>\"Someone who doesn't want to be found.\"<\/p><p>\"Who?\"<\/p><p>Ryan lowered his voice.<\/p><p>\"UNKNOWN.\"<\/p><p>The detective frowned.<\/p><p>\"That's not a person.\"<\/p><p>Ryan looked at him.<\/p><p>\"That's what they want you to think.\"<\/p><p>The room became silent.<\/p><p>Then the computer monitor in the corner suddenly turned on.<\/p><p>Neither of them had touched it.<\/p><p>A username appeared on the screen.<\/p><p><b>UNKNOWN<\/b><\/p><p>Ryan's face went pale.<\/p><p>A message appeared beneath it.<\/p><blockquote><p><b>YOU SHOULD HAVE STAYED SILENT.<\/b><\/p><\/blockquote><p>The detective stood.<\/p><p>\"What is this?\"<\/p><p>Ryan didn't answer.<\/p><p>The screen went black.<\/p><p>The lights flickered.<\/p><p>Then everything returned to normal.<\/p><p>Ryan looked toward the monitor.<\/p><p>\"They know I'm here.\"<\/p><p>The detective looked at him.<\/p><p>\"Who?\"<\/p><p>Ryan whispered:<\/p><p>\"The person who killed Alan.\"<\/p><div class=\"hr\">&#10022;<\/div><p>Across town, Miller returned to the Archive.<\/p><p>The building was almost empty.<\/p><p>He entered the evidence room and closed the door behind him.<\/p><p>Alan's original files were still stored on the secure system.<\/p><p>Miller searched through them again.<\/p><p>He searched the messages.<\/p><p>The photographs.<\/p><p>The deleted files.<\/p><p>The access logs.<\/p><p>Nothing.<\/p><p>Then he noticed a folder he had never seen before.<\/p><p>It had been created <b>before Alan's death<\/b>.<\/p><p>Before Ryan's arrest.<\/p><p>Before the police investigation.<\/p><p>Before the Archive became evidence.<\/p><p>Its name was:<\/p><p><b>CYCLE_01<\/b><\/p><p>Miller stared at it.<\/p><p>He opened the folder.<\/p><p>There was only one file.<\/p><p><b>BEGINNING.txt<\/b><\/p><p>Miller clicked it.<\/p><p>The screen displayed one sentence:<\/p><blockquote><p><b>THIS HAS HAPPENED BEFORE.<\/b><\/p><\/blockquote><p>Miller stopped breathing for a moment.<\/p><p>Then another line appeared.<\/p><blockquote><p><b>AND IT WILL HAPPEN AGAIN.<\/b><\/p><\/blockquote><p>Miller slowly leaned back.<\/p><p>The Archive wasn't simply a collection of information.<\/p><p>It was something older.<\/p><p>Something that had existed before Alan.<\/p><p>Something that had already involved other people.<\/p><p>And Ryan's arrest hadn't ended it.<\/p><p>It had activated something.<\/p><p>Miller looked at the screen.<\/p><p>A final line appeared.<\/p><blockquote><p><b>THE NEXT CYCLE HAS BEGUN.<\/b><\/p><\/blockquote><p>The screen went black.<\/p><p>Miller stood alone in the dark evidence room.<\/p><p>Ryan Mercer had been arrested.<\/p><p>The police believed they were close to solving Alan's murder.<\/p><p>But Miller now knew the truth.<\/p><p>The arrest had not ended the case.<\/p><p>It had opened something much bigger.<\/p><p>Somewhere, someone was watching.<\/p><p>Someone who had planned the arrest.<\/p><p>Someone who wanted Ryan blamed.<\/p><p>And someone who knew exactly what would happen next.<\/p><p>Miller looked toward Alan's photograph.<\/p><p>\"We're not done.\"<\/p><p>The room remained silent.<\/p><p>Then his phone vibrated one final time.<\/p><p>One message.<\/p><p><b>UNKNOWN<\/b><\/p><blockquote><p><b>YOU'RE NEXT.<\/b><\/p><\/blockquote><p>Miller looked at the screen.<\/p><p>The message disappeared.<\/p><p>The investigation had entered a new stage.<\/p><p>Ryan Mercer was behind bars.<\/p><p>The real killer was still free.<\/p><p>And the cycle...<\/p><p>had begun.<\/p><p><b>End of Chapter 16<\/b><\/p>", "c": "Alan Cole"}, {"n": 17, "title": "Finally Freedom", "html": "<p>The killer was caught because of the Archive.<\/p><p>Miller followed the evidence back to the person who had accessed Alan's account after his death.<\/p><p>The trail led to Ryan.<\/p><p>But Ryan was not the killer.<\/p><p>Someone had used his identity to hide the trail.<\/p><p>The evidence finally led to the person who had been watching Alan.<\/p><p>The person who had followed him.<\/p><p>The person who had entered his apartment.<\/p><p>The person who had sent the final reply.<\/p><p>The killer was arrested.<\/p><p>The case was finally solved.<\/p><p>The Archive was sealed.<\/p><p>The UNKNOWN account disappeared.<\/p><p>For the first time in years...<\/p><p>There was silence.<\/p><p>Then, in a library far away, a fourth-grade student opened a black book.<\/p><p>The first page contained one message.<\/p><blockquote><p><b>HELLO.<\/b><\/p><\/blockquote><p>A computer beside him turned on.<\/p><p>A username appeared.<\/p><p><b>UNKNOWN<\/b><\/p><p>Then a reply appeared.<\/p><blockquote><p><b>HELLO.<\/b><\/p><\/blockquote><p>The cycle had begun again.<\/p><p><b>THE END<\/b><\/p>", "c": "Alan Cole"}, {"n": 18, "title": "The New Case", "html": "<p>Three months had passed since Ryan Mercer's arrest.<\/p><p>Three months since the truth had finally come out.<\/p><p>Ryan was free.<\/p><p>Alan's case was officially closed.<\/p><p>The Archive had been sealed.<\/p><p>And Detective Daniel Miller had finally returned to normal police work.<\/p><p>At least, that was what he told himself.<\/p><p>It was a rainy Tuesday morning when Miller received a call from the station.<\/p><p>\"Detective Miller?\"<\/p><p>\"Yes?\"<\/p><p>\"We have a missing person.\"<\/p><p>Miller reached for his coat.<\/p><p>\"How long?\"<\/p><p>\"Since last night.\"<\/p><p>\"Name?\"<\/p><p>There was a pause.<\/p><p>\"Daniel Carter.\"<\/p><p>Miller stopped.<\/p><p>\"Any connection to the old case?\"<\/p><p>\"None that we know of.\"<\/p><p>Miller hung up.<\/p><p>For once, he hoped that answer was true.<\/p><div class=\"hr\">&#10022;<\/div><p>The missing person's apartment was on the fourth floor of an old building.<\/p><p>The door was unlocked.<\/p><p>Miller entered.<\/p><p>Everything looked normal.<\/p><p>A cup of coffee sat on the kitchen table.<\/p><p>A television was still running.<\/p><p>A phone charger was plugged into the wall.<\/p><p>But Daniel Carter was gone.<\/p><p>Miller walked through the apartment.<\/p><p>Nothing appeared stolen.<\/p><p>Nothing appeared broken.<\/p><p>Then he entered the bedroom.<\/p><p>A notebook lay open on the desk.<\/p><p>Miller picked it up.<\/p><p>The first several pages contained ordinary notes.<\/p><p>Shopping lists.<\/p><p>Appointments.<\/p><p>Work reminders.<\/p><p>Then the writing changed.<\/p><p>The final page contained only one sentence:<\/p><blockquote><p><b>I FOUND SOMETHING I WASN'T SUPPOSED TO FIND.<\/b><\/p><\/blockquote><p>Miller stared at it.<\/p><p>He turned the page.<\/p><p>There was nothing.<\/p><p>Then he noticed something underneath the notebook.<\/p><p>A photograph.<\/p><p>It showed a library.<\/p><p>Miller recognized it immediately.<\/p><p>Not because it was famous.<\/p><p>Because he had been there before.<\/p><p>It was the same library where the old investigation had uncovered the Archive.<\/p><p>Miller's phone rang.<\/p><p>\"Detective?\"<\/p><p>It was Mark Henderson.<\/p><p>\"We found something else.\"<\/p><p>\"What?\"<\/p><p>\"Daniel's computer.\"<\/p><p>\"Anything useful?\"<\/p><p>\"You're going to want to see it.\"<\/p><div class=\"hr\">&#10022;<\/div><p>Miller returned to the station.<\/p><p>Mark was waiting beside a computer.<\/p><p>\"We recovered the last file Daniel opened.\"<\/p><p>Miller sat down.<\/p><p>\"What was it?\"<\/p><p>Mark opened the file.<\/p><p>It contained one photograph.<\/p><p>The same library.<\/p><p>But the photograph was different.<\/p><p>Someone was standing in the background.<\/p><p>A person Miller didn't recognize.<\/p><p>\"Who is that?\"<\/p><p>\"We don't know.\"<\/p><p>Miller zoomed in.<\/p><p>The figure's face was hidden.<\/p><p>But something was visible in their hand.<\/p><p>A black book.<\/p><p>Miller's expression changed.<\/p><p>\"No.\"<\/p><p>Mark looked at him.<\/p><p>\"You know it?\"<\/p><p>Miller didn't answer.<\/p><p>He opened the case file from Alan's investigation.<\/p><p>The old photograph was still there.<\/p><p>The same black book.<\/p><p>The same library.<\/p><p>The same symbol on the cover.<\/p><p>The Archive had been sealed.<\/p><p>So how was that book here?<\/p><p>Miller looked at the photograph again.<\/p><p>Then he noticed something written on the back.<\/p><p>A date.<\/p><p><b>Tomorrow.<\/b><\/p><p>Miller checked the calendar.<\/p><p>Tomorrow was Wednesday.<\/p><p>He looked at Mark.<\/p><p>\"We're going to the library.\"<\/p><div class=\"hr\">&#10022;<\/div><p>That night, Miller couldn't sleep.<\/p><p>He kept thinking about Daniel Carter.<\/p><p>A missing man.<\/p><p>A black book.<\/p><p>A library.<\/p><p>And a photograph taken before anyone knew Daniel was missing.<\/p><p>It made no sense.<\/p><p>At <b>2:13 AM<\/b>, Miller's phone vibrated.<\/p><p>He reached for it.<\/p><p>A message from an unknown number.<\/p><p>He opened it.<\/p><p>There was no greeting.<\/p><p>No threat.<\/p><p>Just a photograph.<\/p><p>Miller stared at the image.<\/p><p>It showed the library.<\/p><p>Taken from across the street.<\/p><p>At the bottom of the photograph was a message:<\/p><blockquote><p><b>YOU CLOSED THE WRONG CASE.<\/b><\/p><\/blockquote><p>Miller's heart sank.<\/p><p>He stared at the screen.<\/p><p>Then another message appeared.<\/p><blockquote><p><b>THIS ONE IS DIFFERENT.<\/b><\/p><\/blockquote><p>The phone went silent.<\/p><p>Miller looked out his window.<\/p><p>The city was dark.<\/p><p>Rain covered the glass.<\/p><p>Somewhere out there, Daniel Carter was missing.<\/p><p>And tomorrow, Miller would return to the place where everything had started.<\/p><p>But this time...<\/p><p>It wasn't the same case.<\/p><p>It was something new.<\/p><p><b>End of Chapter 18<\/b><\/p>", "c": "Daniel Carter"}, {"n": 19, "title": "The Library", "html": "<p>The rain had stopped by morning.<\/p><p>Miller arrived at the library before the doors opened.<\/p><p>Mark Henderson was already waiting outside.<\/p><p>\"You brought the photograph?\"<\/p><p>Miller nodded.<\/p><p>\"And the case file.\"<\/p><p>They entered together.<\/p><p>The library was almost completely empty.<\/p><p>Rows of books stretched into the darkness beyond the main entrance.<\/p><p>Miller looked toward the restricted archive.<\/p><p>The door was locked.<\/p><p>Exactly as it had been months earlier.<\/p><p>Mark checked the photograph.<\/p><p>\"The picture was taken here.\"<\/p><p>Miller nodded.<\/p><p>\"But there's something else.\"<\/p><p>He pointed toward the background.<\/p><p>A small clock was visible above the archive entrance.<\/p><p>The time was <b>2:13<\/b>.<\/p><p>The exact time Miller had received the message.<\/p><p>Mark looked at him.<\/p><p>\"Coincidence?\"<\/p><p>\"I don't believe in coincidences anymore.\"<\/p><p>They walked toward the archive.<\/p><p>Miller unlocked the door.<\/p><p>Inside, everything looked untouched.<\/p><p>Dust covered the shelves.<\/p><p>Old documents remained stacked inside cabinets.<\/p><p>There was no computer.<\/p><p>No black book.<\/p><p>Nothing unusual.<\/p><p>Then Mark noticed something on the floor.<\/p><p>A footprint.<\/p><p>Fresh.<\/p><p>Miller crouched beside it.<\/p><p>\"Someone was here.\"<\/p><p>They followed the footprints deeper into the archive.<\/p><p>The trail ended beside an old bookshelf.<\/p><p>Miller examined the books.<\/p><p>One was slightly pulled forward.<\/p><p>He removed it.<\/p><p>Behind it was a small opening.<\/p><p>Inside the opening was a key.<\/p><p>Attached to the key was a label.<\/p><p><b>ROOM 19<\/b><\/p><p>Mark frowned.<\/p><p>\"There isn't a Room 19.\"<\/p><p>Miller looked toward the archive map.<\/p><p>He checked it twice.<\/p><p>There were eighteen rooms.<\/p><p>No Room 19.<\/p><p>Then they heard a sound.<\/p><p>A door closing somewhere behind them.<\/p><p>Miller turned.<\/p><p>\"Who's there?\"<\/p><p>No answer.<\/p><p>He ran toward the sound.<\/p><p>The hallway was empty.<\/p><p>But a piece of paper lay on the floor.<\/p><p>Miller picked it up.<\/p><p>Three words were written on it:<\/p><blockquote><p><b>HE IS HERE.<\/b><\/p><\/blockquote><p>Mark looked around.<\/p><p>\"Daniel?\"<\/p><p>Miller nodded.<\/p><p>They searched the building.<\/p><p>Nothing.<\/p><p>Then they reached the basement.<\/p><p>At the end of the hallway was a door neither of them had seen before.<\/p><p>There was no room number.<\/p><p>Only a small metal plate.<\/p><p><b>19<\/b><\/p><p>Miller inserted the key.<\/p><p>The lock clicked.<\/p><p>The door opened.<\/p><p>Inside was a small room.<\/p><p>A desk.<\/p><p>A chair.<\/p><p>A computer.<\/p><p>And Daniel Carter.<\/p><p>He was sitting on the floor beside the desk.<\/p><p>Alive.<\/p><p>Miller rushed toward him.<\/p><p>\"Daniel!\"<\/p><p>Daniel looked up.<\/p><p>His face was pale.<\/p><p>\"You're too late.\"<\/p><p>Miller helped him stand.<\/p><p>\"Who did this?\"<\/p><p>Daniel looked toward the computer.<\/p><p>\"I don't know.\"<\/p><p>\"What happened?\"<\/p><p>Daniel swallowed.<\/p><p>\"I found the Archive.\"<\/p><p>Miller froze.<\/p><p>Daniel continued.<\/p><p>\"But it wasn't the same Archive.\"<\/p><p>He pointed toward the screen.<\/p><p>A folder was open.<\/p><p>Its name was:<\/p><p><b>CASE 02<\/b><\/p><p>Miller stared at it.<\/p><p>\"What is this?\"<\/p><p>Daniel shook his head.<\/p><p>\"I don't know.\"<\/p><p>The computer suddenly displayed a message.<\/p><blockquote><p><b>ONE CASE ENDS. ANOTHER BEGINS.<\/b><\/p><\/blockquote><p>The screen went black.<\/p><p>Miller looked at Daniel.<\/p><p>Then at Mark.<\/p><p>Nobody spoke.<\/p><p>They had found Daniel.<\/p><p>But they had also found something else.<\/p><p>A new case.<\/p><p>And this time...<\/p><p>Someone had been waiting for them to find it.<\/p><p><b>End of Chapter 19<\/b><\/p>", "c": "Daniel Carter"}, {"n": 20, "title": "Case 02", "html": "<p>Daniel sat on the floor of Room 19, staring at the computer.<\/p><p>The words were still on the screen.<\/p><p>CASE 02<\/p><p>Miller looked at him.<\/p><p>\"Start from the beginning.\"<\/p><p>Daniel took a breath.<\/p><p>\"I wasn't looking for this.\"<\/p><p>\"What were you looking for?\"<\/p><p>\"An old missing-person report.\"<\/p><p>Mark frowned.<\/p><p>\"Why?\"<\/p><p>\"Because I found a name in the original Archive.\"<\/p><p>Miller stepped closer.<\/p><p>\"Whose name?\"<\/p><p>Daniel hesitated.<\/p><p>\"Someone who disappeared before Alan.\"<\/p><p>The room became silent.<\/p><p>Miller looked at the computer.<\/p><p>\"Show me.\"<\/p><p>Daniel moved toward the keyboard.<\/p><p>A file opened.<\/p><p>Inside were photographs, police reports, and newspaper articles.<\/p><p>The first photograph showed a young man standing outside the same library.<\/p><p>The date was seven years earlier.<\/p><p>Miller stared at it.<\/p><p>\"That's the same place.\"<\/p><p>Daniel nodded.<\/p><p>\"He disappeared three days after this photograph was taken.\"<\/p><p>Mark looked through the documents.<\/p><p>\"Was his body ever found?\"<\/p><p>\"No.\"<\/p><p>\"Any suspects?\"<\/p><p>Daniel shook his head.<\/p><p>\"None.\"<\/p><p>Miller looked at the final report.<\/p><p>There was something written at the bottom.<\/p><p>CASE STATUS: UNKNOWN<\/p><p>Miller stopped.<\/p><p>That word again.<\/p><p>But this time it wasn't connected to Alan.<\/p><p>It was connected to a case from seven years ago.<\/p><p>A case that had never been solved.<\/p><p>Daniel opened another file.<\/p><p>A list of names appeared.<\/p><p>Miller read the first name.<\/p><p>Then the second.<\/p><p>Then the third.<\/p><p>His expression changed.<\/p><p>\"These aren't victims.\"<\/p><p>Daniel looked at him.<\/p><p>\"No.\"<\/p><p>\"They're investigators.\"<\/p><p>Daniel nodded.<\/p><p>\"Every person who tried to solve the case disappeared.\"<\/p><p>Mark stepped away from the computer.<\/p><p>\"How many?\"<\/p><p>Daniel looked at the list.<\/p><p>\"Six.\"<\/p><p>Miller stared at the screen.<\/p><p>\"Six investigators.\"<\/p><p>Daniel nodded.<\/p><p>\"And now you're the seventh.\"<\/p><p>The computer suddenly made a sound.<\/p><p>A new file appeared.<\/p><p>MILLER.DAT<\/p><p>Nobody touched the keyboard.<\/p><p>Miller stared at his own name.<\/p><p>The file opened.<\/p><p>Inside was a photograph of him.<\/p><p>Taken that morning.<\/p><p>Outside the library.<\/p><p>Miller's face went pale.<\/p><p>Mark whispered:<\/p><p>\"Someone has been watching us.\"<\/p><p>A second photograph appeared.<\/p><p>This one showed Daniel.<\/p><p>Then Mark.<\/p><p>Then the three of them standing together inside Room 19.<\/p><p>The final photograph showed something else.<\/p><p>A figure standing behind them.<\/p><p>Miller turned around.<\/p><p>The room was empty.<\/p><p>He looked back at the screen.<\/p><p>The photograph had one sentence written underneath it:<\/p><p>YOU WERE NEVER INVESTIGATING CASE 02.<\/p><p>A second sentence appeared.<\/p><p>CASE 02 WAS INVESTIGATING YOU.<\/p><p>The computer shut down.<\/p><p>The room went dark.<\/p><p>And for the first time, Miller realized that finding Daniel had never been the objective.<\/p><p>Daniel had been bait.<\/p><p><b>End of Chapter 20<\/b><\/p>", "c": "Daniel Carter"}, {"n": 21, "title": "The Missing Six", "html": "<p>The lights in Room 19 came back on.<\/p><p>Miller immediately looked at the computer.<\/p><p>The screen was black.<\/p><p>Daniel was still standing beside the desk.<\/p><p>Mark was staring at the photographs.<\/p><p>Six investigators.<\/p><p>Six disappearances.<\/p><p>Seven years.<\/p><p>Miller picked up the old case file.<\/p><p>\"Show me the first investigator.\"<\/p><p>Daniel opened the file.<\/p><p>A photograph appeared.<\/p><p><b>Thomas Reed.<\/b><\/p><p>Missing seven years ago.<\/p><p>Miller opened the next.<\/p><p><b>Sarah Morgan.<\/b><\/p><p>Missing six years ago.<\/p><p>The next.<\/p><p><b>James Carter.<\/b><\/p><p>Five years ago.<\/p><p>Then:<\/p><p><b>Helen Brooks.<\/b><\/p><p><b>Michael Grant.<\/b><\/p><p><b>David Ross.<\/b><\/p><p>Six investigators.<\/p><p>Six missing people.<\/p><p>Miller looked at the dates.<\/p><p>There was a pattern.<\/p><p>Every disappearance happened exactly one year after the previous one.<\/p><p>Mark noticed it too.<\/p><p>\"Every year.\"<\/p><p>Daniel nodded.<\/p><p>\"And there's something else.\"<\/p><p>He opened another document.<\/p><p>At the bottom of every report was the same sentence.<\/p><blockquote><p><b>CASE STATUS: UNKNOWN<\/b><\/p><\/blockquote><p>Miller looked at him.<\/p><p>\"Who wrote these reports?\"<\/p><p>Daniel shook his head.<\/p><p>\"We don't know.\"<\/p><p>\"That's impossible.\"<\/p><p>\"I checked.\"<\/p><p>Daniel opened the original police records.<\/p><p>The reports existed.<\/p><p>The investigators were real.<\/p><p>But the author information had been removed.<\/p><p>Every report had the same blank space where the investigator's name should have been.<\/p><p>Miller stared at the screen.<\/p><p>\"Someone erased them.\"<\/p><p>A sound came from the hallway.<\/p><p>Three knocks.<\/p><p>Everyone froze.<\/p><p><b>Knock.<\/b><\/p><p><b>Knock.<\/b><\/p><p><b>Knock.<\/b><\/p><p>Mark reached for his radio.<\/p><p>\"Who's there?\"<\/p><p>No answer.<\/p><p>Miller slowly opened the door.<\/p><p>The hallway was empty.<\/p><p>But something had been left on the floor.<\/p><p>A black folder.<\/p><p>Miller picked it up.<\/p><p>On the front was a number.<\/p><p><b>07<\/b><\/p><p>He opened it.<\/p><p>Inside was a photograph.<\/p><p>It showed the six missing investigators standing together.<\/p><p>Miller studied their faces.<\/p><p>Then he noticed something.<\/p><p>There was a seventh person in the photograph.<\/p><p>A person standing behind them.<\/p><p>The face had been scratched out.<\/p><p>Daniel stepped closer.<\/p><p>\"Who's that?\"<\/p><p>Miller turned the photograph over.<\/p><p>There was writing on the back.<\/p><blockquote><p><b>THEY WERE LOOKING FOR HIM.<\/b><\/p><\/blockquote><p>Below it was another sentence.<\/p><blockquote><p><b>YOU ARE LOOKING FOR THEM.<\/b><\/p><\/blockquote><p>Miller's eyes narrowed.<\/p><p>Then Daniel noticed something in the bottom corner.<\/p><p>A date.<\/p><p><b>Tomorrow.<\/b><\/p><p>Mark looked at the clock.<\/p><p>\"It's already tomorrow.\"<\/p><p>The three men looked at each other.<\/p><p>A computer behind them suddenly turned on.<\/p><p>A new file appeared.<\/p><p><b>INVESTIGATOR_07<\/b><\/p><p>Miller approached the screen.<\/p><p>The file opened.<\/p><p>A photograph appeared.<\/p><p>It showed Miller.<\/p><p>Taken only seconds earlier.<\/p><p>Then another photograph appeared.<\/p><p>Daniel.<\/p><p>Then Mark.<\/p><p>The final photograph showed the empty hallway outside Room 19.<\/p><p>At the end of the hallway stood the seventh figure.<\/p><p>This time, the face wasn't scratched out.<\/p><p>Miller stared at the screen.<\/p><p>The face belonged to someone he recognized.<\/p><p>Someone who was supposed to be dead.<\/p><p><b>End of Chapter 21<\/b><\/p>", "c": "Daniel Carter"}, {"n": 22, "title": "The Seventh", "html": "<p>Miller couldn't move.<\/p><p>The photograph remained on the screen.<\/p><p>The face belonged to someone he recognized.<\/p><p>Someone who was supposed to be dead.<\/p><p><b>Thomas Reed.<\/b><\/p><p>The first investigator.<\/p><p>The first person who had disappeared while investigating Case 02.<\/p><p>Mark stepped closer to the screen.<\/p><p>\"That's impossible.\"<\/p><p>Daniel stared at the photograph.<\/p><p>\"Who is he?\"<\/p><p>Miller didn't answer immediately.<\/p><p>He opened the original police report.<\/p><p>Thomas Reed had been declared missing seven years ago.<\/p><p>No body had ever been found.<\/p><p>No confirmed sightings.<\/p><p>No evidence that he was still alive.<\/p><p>Yet there he was.<\/p><p>Standing behind the other six investigators.<\/p><p>And the photograph had been taken that night.<\/p><p>Miller looked at Daniel.<\/p><p>\"Nobody leaves this room.\"<\/p><p>Daniel nodded.<\/p><p>Mark locked the door.<\/p><p>Miller returned to the computer.<\/p><p>The photograph disappeared.<\/p><p>A new file opened.<\/p><p><b>REED_THOMAS<\/b><\/p><p>Inside was a single recording.<\/p><p>Miller pressed play.<\/p><p>Static filled the room.<\/p><p>Then a man's voice came through.<\/p><p>\"If you're hearing this, you've found Room 19.\"<\/p><p>Miller recognized the voice.<\/p><p>Thomas Reed.<\/p><p>The recording continued.<\/p><p>\"I thought the disappearances were connected.\"<\/p><p>A pause.<\/p><p>\"I was wrong.\"<\/p><p>The sound of breathing came through the speakers.<\/p><p>\"The investigators weren't being taken because they found the case.\"<\/p><p>Miller leaned closer.<\/p><p>\"They were being taken because they were becoming part of it.\"<\/p><p>The recording suddenly became distorted.<\/p><p>Then Reed spoke again.<\/p><p>\"There is no Case 02.\"<\/p><p>Daniel looked at Miller.<\/p><p>\"What?\"<\/p><p>The voice continued.<\/p><p>\"The number is a lie.\"<\/p><p>The recording stopped.<\/p><p>The computer displayed another message.<\/p><blockquote><p><b>CASE 02 DOES NOT EXIST.<\/b><\/p><\/blockquote><p>Then another.<\/p><blockquote><p><b>THE PEOPLE DO.<\/b><\/p><\/blockquote><p>Miller stared at the screen.<\/p><p>A list appeared.<\/p><p>The six missing investigators.<\/p><p>Then Daniel.<\/p><p>Then Mark.<\/p><p>Then Miller.<\/p><p>Their names were arranged in a circle.<\/p><p>Daniel stepped backward.<\/p><p>\"Why are our names there?\"<\/p><p>Miller didn't answer.<\/p><p>At the center of the circle was one final name.<\/p><p><b>THOMAS REED.<\/b><\/p><p>The lights suddenly went out.<\/p><p>A loud crash came from the hallway.<\/p><p>Mark grabbed his flashlight.<\/p><p>Miller opened the door.<\/p><p>Nothing.<\/p><p>Then Daniel pointed toward the floor.<\/p><p>There were footprints.<\/p><p>Wet footprints.<\/p><p>They led away from Room 19.<\/p><p>Miller followed them.<\/p><p>The trail continued through the archive.<\/p><p>Past the shelves.<\/p><p>Past the locked cabinets.<\/p><p>Until it stopped in front of an old wall.<\/p><p>Miller touched the wall.<\/p><p>Nothing happened.<\/p><p>Then he noticed a small metal plate.<\/p><p><b>07<\/b><\/p><p>He pressed it.<\/p><p>The wall moved.<\/p><p>A hidden passage opened.<\/p><p>Behind it was a narrow room.<\/p><p>And inside the room was Thomas Reed.<\/p><p>Alive.<\/p><p>He looked at Miller.<\/p><p>Then at Daniel.<\/p><p>Then at Mark.<\/p><p>His expression was exhausted.<\/p><p>\"You shouldn't have come here.\"<\/p><p>Miller stared at him.<\/p><p>\"Where have you been?\"<\/p><p>Reed looked toward the hidden passage.<\/p><p>\"Trying to stop the next disappearance.\"<\/p><p>\"Whose?\"<\/p><p>Reed looked directly at Miller.<\/p><p>\"Yours.\"<\/p><p>The lights behind them flickered.<\/p><p>Reed's expression changed.<\/p><p>\"He's here.\"<\/p><p>Miller turned.<\/p><p>At the end of the passage stood a dark figure.<\/p><p>Nobody moved.<\/p><p>Then the figure stepped forward.<\/p><p>Reed whispered:<\/p><p>\"Run.\"<\/p><p><b>End of Chapter 22<\/b><\/p>", "c": "Daniel Carter"}, {"n": 23, "title": "The Escape", "html": "<p>\"Run.\"<\/p><p>Reed didn't say it loudly.<\/p><p>He didn't need to.<\/p><p>Miller grabbed Daniel and pulled him backward.<\/p><p>Mark raised his flashlight toward the figure.<\/p><p>The beam revealed almost nothing.<\/p><p>A dark coat.<\/p><p>A motionless face.<\/p><p>And eyes that seemed to reflect the light without actually seeing it.<\/p><p>Then the figure moved.<\/p><p>Fast.<\/p><p>Mark fired his flashlight directly into its face and shouted.<\/p><p>\"GO!\"<\/p><p>The three investigators ran.<\/p><p>Reed followed behind them.<\/p><p>They rushed through the narrow passage, their footsteps echoing through the walls.<\/p><p>Miller looked back.<\/p><p>The figure was coming after them.<\/p><p>It wasn't running.<\/p><p>It was walking.<\/p><p>Slowly.<\/p><p>Calmly.<\/p><p>As if it already knew where they were going.<\/p><p>They reached the archive.<\/p><p>Mark slammed the hidden door shut.<\/p><p>Something struck the other side.<\/p><p><b>BANG.<\/b><\/p><p>Daniel jumped.<\/p><p>\"What the hell was that?\"<\/p><p>Reed grabbed the metal plate.<\/p><p>\"Keep moving.\"<\/p><p>Miller looked at him.<\/p><p>\"You said you were trying to stop the next disappearance.\"<\/p><p>Reed didn't stop.<\/p><p>\"I was.\"<\/p><p>\"Then tell us what this is.\"<\/p><p>Reed finally turned.<\/p><p>\"You've already seen it.\"<\/p><p>Miller frowned.<\/p><p>\"Seen what?\"<\/p><p>Reed pointed toward the wall.<\/p><p>The number <b>07<\/b> was still visible.<\/p><p>\"Seven investigators.\"<\/p><p>Miller's expression changed.<\/p><p>\"The photograph.\"<\/p><p>Reed nodded.<\/p><p>\"The seventh wasn't supposed to be there.\"<\/p><p>Daniel stepped closer.<\/p><p>\"Thomas, what happened to the other six?\"<\/p><p>Reed looked away.<\/p><p>\"They found the same thing I did.\"<\/p><p>\"What?\"<\/p><p>Reed lowered his voice.<\/p><p>\"A room beneath Room 19.\"<\/p><p>Miller stared at him.<\/p><p>\"There's another room?\"<\/p><p>\"There are several.\"<\/p><p>Before anyone could respond, the archive lights turned on.<\/p><p>Every computer screen displayed the same message.<\/p><blockquote><p><b>SUBJECT 07 HAS RETURNED.<\/b><\/p><\/blockquote><p>Reed froze.<\/p><p>Mark looked at him.<\/p><p>\"Subject 07?\"<\/p><p>Reed didn't answer.<\/p><p>Another message appeared.<\/p><blockquote><p><b>THOMAS REED — STATUS: ACTIVE<\/b><\/p><\/blockquote><p>Then:<\/p><blockquote><p><b>MILLER — STATUS: ACTIVE<\/b><\/p><\/blockquote><blockquote><p><b>DANIEL — STATUS: ACTIVE<\/b><\/p><\/blockquote><blockquote><p><b>MARK — STATUS: ACTIVE<\/b><\/p><\/blockquote><p>Miller's stomach dropped.<\/p><p>\"Why does it say we're subjects?\"<\/p><p>Reed looked at the screens.<\/p><p>\"Because that's what we've always been.\"<\/p><p>A loud alarm began to sound.<\/p><p>Red lights flashed across the archive.<\/p><p>Then the doors automatically locked.<\/p><p>Daniel ran to the nearest exit.<\/p><p>\"It's locked!\"<\/p><p>Mark tried another.<\/p><p>\"All of them!\"<\/p><p>Miller turned toward Reed.<\/p><p>\"You knew this would happen.\"<\/p><p>Reed shook his head.<\/p><p>\"Not exactly.\"<\/p><p>The screens changed again.<\/p><p>A final message appeared.<\/p><blockquote><p><b>FOUR ACTIVE.<\/b><\/p><\/blockquote><p>Then a countdown appeared.<\/p><p><b>10<\/b><\/p><p><b>9<\/b><\/p><p><b>8<\/b><\/p><p>Miller looked at Reed.<\/p><p>\"What happens at zero?\"<\/p><p>Reed's face went pale.<\/p><p>\"The system chooses one.\"<\/p><p><b>7<\/b><\/p><p><b>6<\/b><\/p><p>Daniel stepped backward.<\/p><p>\"Chooses one for what?\"<\/p><p>Reed looked directly at Miller.<\/p><p>\"To disappear.\"<\/p><p><b>5<\/b><\/p><p><b>4<\/b><\/p><p>The lights went out.<\/p><p><b>3<\/b><\/p><p>A sound came from inside the walls.<\/p><p><b>2<\/b><\/p><p>Miller heard someone whisper his name.<\/p><p><b>1<\/b><\/p><p>The lights returned.<\/p><p>Daniel was standing beside him.<\/p><p>Mark was there.<\/p><p>Miller was there.<\/p><p>But Reed was gone.<\/p><p>The archive was silent.<\/p><p>On the nearest computer, a new message appeared.<\/p><blockquote><p><b>SUBJECT 07 REMOVED.<\/b><\/p><\/blockquote><p>Miller stared at it.<\/p><p>Daniel whispered:<\/p><p>\"He's gone.\"<\/p><p>Miller shook his head.<\/p><p>\"No.\"<\/p><p>He looked toward the hidden passage.<\/p><p>\"He wasn't removed.\"<\/p><p>A final line appeared beneath the message.<\/p><blockquote><p><b>HE WAS RETURNED.<\/b><\/p><\/blockquote><p>Far below them, somewhere beneath Room 19, a metal door opened.<\/p><p>Thomas Reed stepped into the darkness.<\/p><p>And waiting for him was the same figure.<\/p><p>This time, Reed didn't run.<\/p><p>He simply said:<\/p><p>\"You're too late.\"<\/p><p>The figure tilted its head.<\/p><p>Reed smiled.<\/p><p>\"Because Miller knows where to look now.\"<\/p><p><b>End of Chapter 23<\/b><\/p>", "c": "Daniel Carter"}, {"n": 24, "title": "Where to Look", "html": "<p>Miller didn't speak during the drive home.<\/p><p>The city passed outside his window, but he barely noticed it.<\/p><p>Thomas Reed was gone.<\/p><p>The archive had called him <b>Subject 07<\/b>.<\/p><p>And the final message had said:<\/p><blockquote><p><b>HE WAS RETURNED.<\/b><\/p><\/blockquote><p>Miller couldn't stop thinking about those words.<\/p><p>Returned to where?<\/p><p>He pulled into his driveway just after midnight.<\/p><p>The house was dark.<\/p><p>He unlocked the door and stepped inside.<\/p><p>Everything looked normal.<\/p><p>Too normal.<\/p><p>Miller placed his keys on the table and walked toward his office.<\/p><p>He stopped.<\/p><p>Something was sitting on his desk.<\/p><p>A file.<\/p><p>He hadn't left it there.<\/p><p>Miller slowly approached.<\/p><p>The folder was old and slightly damaged.<\/p><p>On the front were three words.<\/p><p><b>MISSING PERSONS UNIT<\/b><\/p><p>Underneath was a case number.<\/p><p><b>CASE 11.<\/b><\/p><p>Miller opened it.<\/p><p>The first page contained a photograph.<\/p><p>A young man.<\/p><p><b>Name: Ethan Cole<\/b><\/p><p><b>Age: 29<\/b><\/p><p><b>Last Seen: August 14<\/b><\/p><p><b>Location: Northbridge Station<\/b><\/p><p>Miller turned the page.<\/p><p>Another photograph.<\/p><p>Another missing person.<\/p><p>Then another.<\/p><p>There were eleven names.<\/p><p>Miller looked at the dates.<\/p><p>They weren't random.<\/p><p>Every person had disappeared exactly seven days after the previous disappearance.<\/p><p>His eyes moved down the list.<\/p><p>The eleventh name had disappeared yesterday.<\/p><p>Miller froze.<\/p><p>Yesterday.<\/p><p>The same day Reed had disappeared.<\/p><p>He turned to the final page.<\/p><p>There was a handwritten note.<\/p><p>Four words.<\/p><p><b>LOOK WHERE THEY LOOKED.<\/b><\/p><p>Miller recognized the handwriting.<\/p><p>Thomas Reed.<\/p><p>He immediately grabbed his phone.<\/p><p>Before he could call anyone, the screen lit up.<\/p><p>Unknown number.<\/p><p>Miller answered.<\/p><p>Silence.<\/p><p>Then a voice.<\/p><p>\"You're getting closer.\"<\/p><p>Miller stood completely still.<\/p><p>\"Who is this?\"<\/p><p>The voice didn't answer.<\/p><p>Instead, it said:<\/p><p>\"Northbridge Station.\"<\/p><p>The call ended.<\/p><p>Miller looked back at the file.<\/p><p>Northbridge Station.<\/p><p>That was where Ethan Cole had disappeared.<\/p><p>But there was something else.<\/p><p>A small map had been attached to the back of the file.<\/p><p>Miller unfolded it.<\/p><p>The station was circled.<\/p><p>So was Room 19.<\/p><p>Then another location.<\/p><p>And another.<\/p><p>Miller stared at the map.<\/p><p>The locations formed a pattern.<\/p><p>A route.<\/p><p>He followed it with his finger.<\/p><p>Northbridge Station.<\/p><p>The old archive.<\/p><p>Room 19.<\/p><p>Then one final location.<\/p><p>An abandoned building on the edge of the city.<\/p><p>Miller recognized the address.<\/p><p>He had seen it before.<\/p><p>It was mentioned in Thomas Reed's original investigation.<\/p><p>He finally understood.<\/p><p>The missing persons cases weren't separate.<\/p><p>They were connected.<\/p><p>And now he knew where to look.<\/p><p>Miller closed the file.<\/p><p>He grabbed his coat.<\/p><p>Then he noticed something written on the inside cover.<\/p><p>A sentence he hadn't seen before.<\/p><p><b>DON'T TRUST THE FIRST PERSON YOU FIND.<\/b><\/p><p>Miller stopped.<\/p><p>For the first time that night, he felt afraid.<\/p><p>Not because he didn't know where to go.<\/p><p>Because now he did.<\/p><p>He turned off the lights.<\/p><p>Locked the door.<\/p><p>And drove toward the abandoned building.<\/p><p>Behind him, inside his house, the file remained open on the desk.<\/p><p>The page slowly turned by itself.<\/p><p>Beneath the eleven names was a twelfth.<\/p><p><b>MILLER.<\/b><\/p><p>Beside it was a status.<\/p><p><b>ACTIVE.<\/b><\/p><p><b>End of Chapter 24<\/b><\/p>", "c": "Ethan Cole"}, {"n": 25, "title": "The Abandoned Building", "html": "<p>Miller drove without turning on the radio.<\/p><p>The city disappeared behind him.<\/p><p>Streetlights became fewer.<\/p><p>Buildings became older.<\/p><p>Eventually, there was almost nothing left except empty roads and darkness.<\/p><p>He checked the address again.<\/p><p>It was correct.<\/p><p>The abandoned building appeared at the end of the road.<\/p><p>Three floors.<\/p><p>Broken windows.<\/p><p>A rusted metal door.<\/p><p>No lights.<\/p><p>No cars.<\/p><p>Nothing that suggested anyone had been there in years.<\/p><p>Miller parked across the street.<\/p><p>He stayed inside the car for a moment.<\/p><p>The warning was still in his head.<\/p><p><b>DON'T TRUST THE FIRST PERSON
