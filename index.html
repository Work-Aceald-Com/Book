YOU FIND.<\/b><\/p><p>He reached into the passenger seat and picked up the missing persons file.<\/p><p>Ethan Cole.<\/p><p>Ten other names.<\/p><p>Then Miller's own name.<\/p><p><b>ACTIVE.<\/b><\/p><p>He opened the door.<\/p><p>Cold air hit him.<\/p><p>Miller crossed the street.<\/p><p>The front door of the building was already open.<\/p><p>He stopped.<\/p><p>He hadn't opened it.<\/p><p>Slowly, he stepped inside.<\/p><p>The smell of dust and damp concrete filled the hallway.<\/p><p>His flashlight moved across the walls.<\/p><p>Old paint.<\/p><p>Broken doors.<\/p><p>Abandoned furniture.<\/p><p>Nothing else.<\/p><p>Then he saw something.<\/p><p>A piece of paper had been taped to the wall.<\/p><p>Miller pulled it down.<\/p><p>There was only one word.<\/p><p><b>NINETEEN.<\/b><\/p><p>His eyes narrowed.<\/p><p>Room 19.<\/p><p>The same room from the map.<\/p><p>He looked down the hallway.<\/p><p>A staircase led upward.<\/p><p>Miller climbed.<\/p><p>The second floor was almost completely dark.<\/p><p>At the end of the hallway was a door.<\/p><p>A small metal plate was attached to it.<\/p><p><b>19<\/b><\/p><p>Miller reached for the handle.<\/p><p>It opened.<\/p><p>Inside was a desk.<\/p><p>A chair.<\/p><p>A single lamp.<\/p><p>And a wall covered with photographs.<\/p><p>Miller stepped inside.<\/p><p>His flashlight moved across them.<\/p><p>Ethan Cole.<\/p><p>Thomas Reed.<\/p><p>The other missing people.<\/p><p>All eleven.<\/p><p>Miller walked closer.<\/p><p>Each photograph had a date beneath it.<\/p><p>Then he saw something that made him stop.<\/p><p>His own photograph.<\/p><p>It had been taken recently.<\/p><p>Very recently.<\/p><p>Beneath it was a date.<\/p><p><b>August 17.<\/b><\/p><p>Today's date.<\/p><p>Miller slowly lowered his flashlight.<\/p><p>Someone had been watching him.<\/p><p>Someone had known exactly where he would go.<\/p><p>A sound came from behind him.<\/p><p>Miller turned.<\/p><p>The door was closed.<\/p><p>He hadn't heard it move.<\/p><p>He approached it.<\/p><p>Then a voice came from the other side.<\/p><p>\"You're late.\"<\/p><p>Miller froze.<\/p><p>He knew that voice.<\/p><p>\"Reed?\"<\/p><p>Silence.<\/p><p>Then the voice spoke again.<\/p><p>\"Don't open the door.\"<\/p><p>Miller stepped backward.<\/p><p>\"Where are you?\"<\/p><p>\"Not here.\"<\/p><p>Miller stared at the door.<\/p><p>\"Then where?\"<\/p><p>A pause.<\/p><p>\"Where they all went.\"<\/p><p>Miller's grip tightened around the flashlight.<\/p><p>\"What is this place?\"<\/p><p>\"The beginning.\"<\/p><p>Miller looked back at the photographs.<\/p><p>There was something he hadn't noticed.<\/p><p>A symbol had been marked on every picture.<\/p><p>The same symbol.<\/p><p>Except Ethan's.<\/p><p>Ethan's photograph had a different mark.<\/p><p>A small black circle.<\/p><p>Miller walked toward it.<\/p><p>Under Ethan's photograph was a handwritten note.<\/p><p><b>CASE 11 WAS NEVER THE TARGET.<\/b><\/p><p>Miller read it again.<\/p><p>Then he understood.<\/p><p>The missing people weren't the purpose.<\/p><p>They were being used to lead someone somewhere.<\/p><p>Someone specific.<\/p><p>Him.<\/p><p>A loud metallic sound echoed from downstairs.<\/p><p>Miller turned toward the door.<\/p><p>Someone had entered the building.<\/p><p>Footsteps moved across the floor below.<\/p><p>Slowly.<\/p><p>One step at a time.<\/p><p>Miller switched off his flashlight.<\/p><p>The footsteps stopped.<\/p><p>He waited.<\/p><p>Nothing.<\/p><p>Then his phone vibrated.<\/p><p>He pulled it from his pocket.<\/p><p>One new message.<\/p><p><b>YOU FOUND THE ROOM.<\/b><\/p><p>Another message appeared.<\/p><p><b>NOW FIND ETHAN.<\/b><\/p><p>Miller stared at the screen.<\/p><p>A final message appeared.<\/p><p><b>HE'S STILL ALIVE.<\/b><\/p><p>Miller looked at Ethan's photograph.<\/p><p>For the first time, the case had given him something other than another dead end.<\/p><p>A living victim.<\/p><p>But before he could move, the door behind him opened.<\/p><p>Miller turned.<\/p><p>A man stood in the doorway.<\/p><p>His face was hidden in the darkness.<\/p><p>Miller raised his flashlight.<\/p><p>The beam revealed him.<\/p><p>Miller's expression changed.<\/p><p>It wasn't Thomas Reed.<\/p><p>It wasn't Ethan Cole.<\/p><p>It was someone Miller had seen before.<\/p><p>Someone who was supposed to be dead.<\/p><p>The man looked directly at him.<\/p><p>Then he said:<\/p><p>\"You shouldn't have come here.\"<\/p><p>Miller took a step forward.<\/p><p>\"Who are you?\"<\/p><p>The man didn't answer.<\/p><p>He looked toward Ethan's photograph.<\/p><p>Then back at Miller.<\/p><p>\"You're looking in the wrong place.\"<\/p><p>Miller's eyes narrowed.<\/p><p>\"Then where is Ethan?\"<\/p><p>The man smiled faintly.<\/p><p>\"Closer than you think.\"<\/p><p>The lights suddenly came on.<\/p><p>Every photograph on the wall was gone.<\/p><p>The room was empty.<\/p><p>The man had disappeared.<\/p><p>Miller stood alone.<\/p><p>On the desk was a single sheet of paper.<\/p><p>He picked it up.<\/p><p>There was an address written on it.<\/p><p>And beneath the address:<\/p><p><b>CASE 11 — FINAL LOCATION<\/b><\/p><p>Miller stared at the page.<\/p><p>He knew the address.<\/p><p>It was somewhere he had been before.<\/p><p>Somewhere he never expected to return.<\/p><p>His own house.<\/p><p>Miller looked toward the doorway.<\/p><p>The building was silent again.<\/p><p>Then his phone vibrated one more time.<\/p><p>Unknown number.<\/p><p>One message.<\/p><p><b>THE END STARTED WHEN YOU OPENED THE FILE.<\/b><\/p><p>Miller looked at the address again.<\/p><p>Then he walked out of Room 19.<\/p><p>This time, he knew exactly where to go.<\/p><p>And somewhere in the darkness, someone was already waiting for him.<\/p><p><b>End of Chapter 25<\/b><\/p>", "c": "Ethan Cole"}, {"n": 26, "title": "The House", "html": "<p>Miller drove back toward the city.<\/p><p>He didn't turn on the radio.<\/p><p>He didn't call the police.<\/p><p>He didn't call anyone.<\/p><p>The address on the paper kept running through his mind.<\/p><p>His own house.<\/p><p>It made no sense.<\/p><p>He had just left it.<\/p><p>But someone had been there.<\/p><p>Someone had left the file.<\/p><p>Someone had been watching him.<\/p><p>And now the case was telling him to go back.<\/p><p>Miller pulled into his driveway.<\/p><p>The house was dark.<\/p><p>He left the car running for a few seconds.<\/p><p>Then he noticed something.<\/p><p>The front door was open.<\/p><p>Miller reached for his gun.<\/p><p>He stepped out.<\/p><p>The street was completely empty.<\/p><p>He approached the house slowly.<\/p><p>Nothing moved.<\/p><p>He entered.<\/p><p>The living room looked exactly as he had left it.<\/p><p>The missing persons file was still on the desk.<\/p><p>But something had changed.<\/p><p>The twelfth name was gone.<\/p><p>Miller walked closer.<\/p><p>His own name had disappeared.<\/p><p>Instead, a new name had been written underneath Ethan Cole.<\/p><p><b>THOMAS REED.<\/b><\/p><p>Miller stared at it.<\/p><p>Reed was supposed to be gone.<\/p><p>Returned.<\/p><p>Whatever that meant.<\/p><p>A sound came from upstairs.<\/p><p>One slow footstep.<\/p><p>Miller looked toward the staircase.<\/p><p>Another.<\/p><p>He raised his weapon.<\/p><p>\"Who's there?\"<\/p><p>No answer.<\/p><p>Miller climbed the stairs.<\/p><p>The hallway was dark.<\/p><p>His bedroom door was open.<\/p><p>He hadn't left it open.<\/p><p>He stepped inside.<\/p><p>The room was empty.<\/p><p>Then he noticed the mirror.<\/p><p>Written across the glass was a message.<\/p><p><b>YOU KEEP LOOKING FOR THE KILLER.<\/b><\/p><p>Miller stared at it.<\/p><p>A second line appeared beneath it.<\/p><p>Not written.<\/p><p>Carved.<\/p><p><b>LOOK FOR THE VICTIMS.<\/b><\/p><p>Miller stepped closer.<\/p><p>His phone rang.<\/p><p>Unknown number.<\/p><p>He answered.<\/p><p>\"Who are you?\"<\/p><p>A familiar voice replied.<\/p><p>\"Someone who tried to stop this.\"<\/p><p>Miller froze.<\/p><p>\"Reed?\"<\/p><p>\"No.\"<\/p><p>The voice paused.<\/p><p>\"Someone before Reed.\"<\/p><p>Miller looked at the mirror.<\/p><p>\"What happened to Ethan Cole?\"<\/p><p>Silence.<\/p><p>Then:<\/p><p>\"He found the truth.\"<\/p><p>\"What truth?\"<\/p><p>The voice lowered.<\/p><p>\"The missing people weren't being killed.\"<\/p><p>Miller's expression changed.<\/p><p>\"Then where are they?\"<\/p><p>\"They were being moved.\"<\/p><p>\"Where?\"<\/p><p>A long pause.<\/p><p>\"Northbridge.\"<\/p><p>Miller looked toward the window.<\/p><p>\"Northbridge Station?\"<\/p><p>\"No.\"<\/p><p>The voice whispered:<\/p><p>\"Under it.\"<\/p><p>The call ended.<\/p><p>Miller immediately returned to his office.<\/p><p>He opened the file again.<\/p><p>The map was still there.<\/p><p>He studied it carefully.<\/p><p>The locations connected to Northbridge Station.<\/p><p>But there was one detail he had missed.<\/p><p>A small symbol beneath the station.<\/p><p>A line leading underground.<\/p><p>Miller grabbed his coat.<\/p><p>Before leaving, he looked at the photograph of Ethan Cole.<\/p><p>There was something written on the back.<\/p><p>He turned it over.<\/p><p><b>IF YOU FIND THIS, DON'T COME ALONE.<\/b><\/p><p>Miller stopped.<\/p><p>The warning from Chapter 24 returned to him.<\/p><p><b>DON'T TRUST THE FIRST PERSON YOU FIND.<\/b><\/p><p>Maybe it wasn't telling him not to trust someone he would meet.<\/p><p>Maybe it was telling him not to trust anyone.<\/p><p>Miller folded the photograph and put it in his pocket.<\/p><p>He walked outside.<\/p><p>This time, he didn't look back.<\/p><p>The house remained silent behind him.<\/p><p>But upstairs, the mirror changed.<\/p><p>A new sentence appeared.<\/p><p><b>HE'S COMING.<\/b><\/p><p>Then another.<\/p><p><b>ETHAN COLE.<\/b><\/p><p><b>STATUS: FOUND.<\/b><\/p><p><b>End of Chapter 26<\/b><\/p>", "c": "Ethan Cole"}, {"n": 27, "title": "Underground", "html": "<p>Miller reached Northbridge Station just before dawn.<\/p><p>The station was almost empty.<\/p><p>A few lights flickered above the platforms.<\/p><p>A train passed without stopping.<\/p><p>Miller stood near the old service entrance, holding Ethan Cole's photograph.<\/p><p>The map had been right.<\/p><p>There was something beneath the station.<\/p><p>He found the entrance behind a locked maintenance door.<\/p><p>The lock had already been broken.<\/p><p>Miller pushed the door open.<\/p><p>A staircase disappeared into darkness.<\/p><p>He turned on his flashlight and went down.<\/p><p>One floor.<\/p><p>Then another.<\/p><p>The sound of the station above slowly disappeared.<\/p><p>At the bottom was a narrow concrete corridor.<\/p><p>Miller followed it.<\/p><p>After several minutes, he reached a metal door.<\/p><p>There was writing on it.<\/p><p><b>ARCHIVE B<\/b><\/p><p>Miller opened it.<\/p><p>The room beyond was enormous.<\/p><p>Rows of filing cabinets stretched into the darkness.<\/p><p>Photographs covered the walls.<\/p><p>Names.<\/p><p>Dates.<\/p><p>Addresses.<\/p><p>Missing persons.<\/p><p>Miller walked between the shelves.<\/p><p>Then he stopped.<\/p><p>A folder was sitting on a table.<\/p><p><b>ETHAN COLE<\/b><\/p><p>He opened it.<\/p><p>The first page was a photograph of Ethan.<\/p><p>The second contained his disappearance report.<\/p><p>The third contained something completely different.<\/p><p>A transcript.<\/p><p>Miller read it.<\/p><blockquote><p>\"Subject refuses to cooperate.\"<\/p><\/blockquote><p>He turned the page.<\/p><blockquote><p>\"Subject claims he knows who is responsible.\"<\/p><\/blockquote><p>Another page.<\/p><blockquote><p>\"Subject identified Miller.\"<\/p><\/blockquote><p>Miller froze.<\/p><p>His own name.<\/p><p>Again.<\/p><p>He kept reading.<\/p><blockquote><p>\"Subject believes Miller is being followed.\"<\/p><\/blockquote><p>Then:<\/p><blockquote><p>\"Subject requested contact.\"<\/p><\/blockquote><p>Miller looked around the room.<\/p><p>\"Ethan?\"<\/p><p>Nothing.<\/p><p>He continued reading.<\/p><p>The final page contained a date.<\/p><p><b>August 17.<\/b><\/p><p>Today's date.<\/p><p>Beneath it:<\/p><p><b>SUBJECT WILL RETURN.<\/b><\/p><p>Miller heard a noise behind him.<\/p><p>He turned.<\/p><p>A figure stood between the shelves.<\/p><p>\"Ethan?\"<\/p><p>The figure stepped into the light.<\/p><p>It was Ethan Cole.<\/p><p>Miller stared at him.<\/p><p>Ethan looked exhausted.<\/p><p>His clothes were dirty.<\/p><p>There were cuts across his face.<\/p><p>But he was alive.<\/p><p>\"You're Miller,\" Ethan said.<\/p><p>Miller lowered his flashlight slightly.<\/p><p>\"How do you know me?\"<\/p><p>Ethan looked toward the files.<\/p><p>\"Because they told me about you.\"<\/p><p>\"Who?\"<\/p><p>Ethan didn't answer immediately.<\/p><p>Instead, he walked toward Miller.<\/p><p>\"They've been watching you for a long time.\"<\/p><p>Miller's expression hardened.<\/p><p>\"Who are they?\"<\/p><p>Ethan looked directly into his eyes.<\/p><p>\"The people who created the cases.\"<\/p><p>Miller said nothing.<\/p><p>Ethan continued.<\/p><p>\"Every disappearance was planned.\"<\/p><p>\"Why?\"<\/p><p>\"To find people who could be controlled.\"<\/p><p>Miller looked at the files.<\/p><p>\"And the people who disappeared?\"<\/p><p>\"Some were taken.\"<\/p><p>\"Taken where?\"<\/p><p>Ethan pointed deeper into the archive.<\/p><p>\"Some are still here.\"<\/p><p>Miller followed his finger.<\/p><p>At the end of the room was another door.<\/p><p>A red light blinked above it.<\/p><p>Ethan stepped toward it.<\/p><p>\"That's where they kept us.\"<\/p><p>Miller followed.<\/p><p>Before Ethan could open the door, the entire archive went dark.<\/p><p>A loud metallic lock sounded behind them.<\/p><p>Then another.<\/p><p>Then another.<\/p><p>The doors were sealing.<\/p><p>Miller turned.<\/p><p>\"Ethan.\"<\/p><p>Ethan looked back.<\/p><p>\"It's starting.\"<\/p><p>\"What is?\"<\/p><p>Ethan's face went pale.<\/p><p>\"The next disappearance.\"<\/p><p>A speaker above them crackled.<\/p><p>A distorted voice filled the room.<\/p><p>\"Case 11 has been recovered.\"<\/p><p>Miller looked at Ethan.<\/p><p>The voice continued.<\/p><p>\"Subject 11 is no longer required.\"<\/p><p>Ethan backed away.<\/p><p>\"No.\"<\/p><p>The lights returned.<\/p><p>But Ethan was gone.<\/p><p>Miller stood alone.<\/p><p>The door in front of him slowly opened.<\/p><p>Inside was a single chair.<\/p><p>On the chair was a photograph.<\/p><p>Miller picked it up.<\/p><p>It showed Ethan.<\/p><p>But behind him stood someone else.<\/p><p>Miller recognized the face.<\/p><p>Thomas Reed.<\/p><p>Alive.<\/p><p>And beneath the photograph was one final message.<\/p><p><b>CASE 11 WAS NEVER ETHAN.<\/b><\/p><p>Miller turned the photograph over.<\/p><p>Three words were written on the back.<\/p><p><b>CASE 11 WAS YOU.<\/b><\/p><p>Miller stared at the words.<\/p><p>Then the speaker crackled again.<\/p><p>\"Welcome back, Miller.\"<\/p><p>The door slammed shut.<\/p><p><b>End of Chapter 27<\/b><\/p>", "c": "Ethan Cole"}, {"n": 28, "title": "Case 11", "html": "<p>Miller stood in the darkness.<\/p><p>The door wouldn't move.<\/p><p>He tried the handle again.<\/p><p>Locked.<\/p><p>He stepped back and looked at the photograph.<\/p><p>Ethan.<\/p><p>Thomas Reed.<\/p><p>And himself.<\/p><p>Three people connected to the same case.<\/p><p>But the message still didn't make sense.<\/p><p><b>CASE 11 WAS YOU.<\/b><\/p><p>Miller looked at the chair.<\/p><p>The room was completely empty.<\/p><p>No cameras.<\/p><p>No windows.<\/p><p>Nothing.<\/p><p>Then he noticed something beneath the chair.<\/p><p>A small metal box.<\/p><p>He picked it up.<\/p><p>There was a number engraved on the lid.<\/p><p><b>11<\/b><\/p><p>Miller opened it.<\/p><p>Inside was a key.<\/p><p>And a folded piece of paper.<\/p><p>He unfolded it.<\/p><p>There was only one sentence.<\/p><p><b>YOU WERE NEVER THE INVESTIGATOR.<\/b><\/p><p>Miller stared at it.<\/p><p>The memory hit him.<\/p><p>A case from years ago.<\/p><p>A missing person.<\/p><p>A photograph.<\/p><p>A name he had forgotten.<\/p><p>He remembered finding the person.<\/p><p>He remembered the police arriving.<\/p><p>But he couldn't remember what happened afterward.<\/p><p>Miller closed his eyes.<\/p><p>More memories surfaced.<\/p><p>A room.<\/p><p>A table.<\/p><p>A bright light.<\/p><p>Someone asking questions.<\/p><p>Then nothing.<\/p><p>He opened his eyes.<\/p><p>The room suddenly felt smaller.<\/p><p>Miller looked at the key.<\/p><p>There was a tiny label attached to it.<\/p><p><b>ARCHIVE 01<\/b><\/p><p>He walked to the wall.<\/p><p>There was a keyhole he hadn't noticed before.<\/p><p>He inserted the key.<\/p><p>The wall clicked.<\/p><p>A hidden door opened.<\/p><p>Behind it was another corridor.<\/p><p>Miller entered.<\/p><p>The corridor ended at a large observation room.<\/p><p>Glass separated it from another chamber.<\/p><p>Inside were dozens of monitors.<\/p><p>Every screen showed a different missing person.<\/p><p>Ethan.<\/p><p>Thomas.<\/p><p>The other ten.<\/p><p>Then Miller's own face appeared on every screen.<\/p><p>A recording began.<\/p><p>A younger version of Miller appeared.<\/p><p>He was sitting in a chair.<\/p><p>Someone stood behind the camera.<\/p><p>\"You agreed to the investigation.\"<\/p><p>Young Miller looked confused.<\/p><p>\"Why me?\"<\/p><p>The recording stopped.<\/p><p>Another began.<\/p><p>Miller was standing in the same building.<\/p><p>Years earlier.<\/p><p>He was holding a folder.<\/p><p>The label was visible.<\/p><p><b>CASE 11.<\/b><\/p><p>Miller watched in silence.<\/p><p>He had been here before.<\/p><p>He hadn't discovered the case.<\/p><p>He had been part of it.<\/p><p>A third recording started.<\/p><p>Thomas Reed appeared on the screen.<\/p><p>He looked directly into the camera.<\/p><p>\"If Miller sees this, the memory procedure failed.\"<\/p><p>Miller froze.<\/p><p>Reed continued.<\/p><p>\"He's going to think he's investigating us.\"<\/p><p>A pause.<\/p><p>\"He isn't.\"<\/p><p>The screen went black.<\/p><p>Then one final message appeared.<\/p><p><b>HE IS INVESTIGATING HIMSELF.<\/b><\/p><p>Miller stepped away from the monitor.<\/p><p>Everything he believed about the case was collapsing.<\/p><p>The missing people.<\/p><p>The archive.<\/p><p>Reed.<\/p><p>Ethan.<\/p><p>Himself.<\/p><p>It was all connected.<\/p><p>But there was one question left.<\/p><p>Why had his memories been erased?<\/p><p>A door opened behind him.<\/p><p>Miller turned.<\/p><p>Ethan stood there.<\/p><p>Alive.<\/p><p>Miller stared at him.<\/p><p>\"You knew.\"<\/p><p>Ethan nodded.<\/p><p>\"I remembered.\"<\/p><p>\"Remembered what?\"<\/p><p>Ethan looked at the screens.<\/p><p>\"You were the first one they took.\"<\/p><p>Miller said nothing.<\/p><p>Ethan continued.<\/p><p>\"Before any of us disappeared, you were already inside this place.\"<\/p><p>Miller looked down at the folder in his hand.<\/p><p>\"Then why don't I remember?\"<\/p><p>Ethan's expression hardened.<\/p><p>\"Because you asked them to make you forget.\"<\/p><p>Miller stared at him.<\/p><p>\"Why?\"<\/p><p>Ethan didn't answer.<\/p><p>Instead, he handed Miller another photograph.<\/p><p>It showed Miller standing beside Thomas Reed.<\/p><p>Both of them were younger.<\/p><p>Behind them was a sign.<\/p><p><b>NORTHBRIDGE RESEARCH FACILITY<\/b><\/p><p>On the back was a date.<\/p><p><b>August 17.<\/b><\/p><p>Twenty years earlier.<\/p><p>Miller looked at Ethan.<\/p><p>\"What happened that day?\"<\/p><p>Ethan stepped closer.<\/p><p>\"You found out what they were doing.\"<\/p><p>\"And?\"<\/p><p>\"You tried to stop them.\"<\/p><p>Miller's eyes moved back to the photograph.<\/p><p>\"What happened to Reed?\"<\/p><p>Ethan looked away.<\/p><p>\"He didn't make it out.\"<\/p><p>Miller's expression changed.<\/p><p>\"But I just saw him.\"<\/p><p>Ethan shook his head.<\/p><p>\"No.\"<\/p><p>Miller stared at him.<\/p><p>Ethan whispered:<\/p><p>\"That wasn't Reed.\"<\/p><p>The lights suddenly went out.<\/p><p>A voice came through the speakers.<\/p><p>This time, Miller recognized it.<\/p><p>It was his own voice.<\/p><p>Recorded years earlier.<\/p><p>\"If you're hearing this, they've already started again.\"<\/p><p>Miller looked at Ethan.<\/p><p>The recording continued.<\/p><p>\"Don't trust anyone.\"<\/p><p>A pause.<\/p><p>\"Especially Ethan.\"<\/p><p>Ethan's face changed.<\/p><p>Miller slowly turned toward him.<\/p><p>For several seconds, neither of them moved.<\/p><p>Then Ethan said:<\/p><p>\"You need to listen to the rest.\"<\/p><p>The recording continued.<\/p><p>\"There is one person who knows everything.\"<\/p><p>Miller waited.<\/p><p>The final sentence played.<\/p><p><b>Find Thomas Reed.<\/b><\/p><p>The speakers went silent.<\/p><p>Miller looked at Ethan.<\/p><p>Ethan looked back.<\/p><p>For the first time, neither of them knew who to trust.<\/p><p>And somewhere deep beneath Northbridge Station, a locked door opened by itself.<\/p><p><b>End of Chapter 28<\/b><\/p>", "c": "Ethan Cole"}, {"n": 29, "title": "The Real Reed", "html": "<p>Miller didn't move.<\/p><p>The recording had ended.<\/p><p>But the last words remained in his mind.<\/p><p><b>Find Thomas Reed.<\/b><\/p><p>Ethan stood across from him.<\/p><p>Neither spoke.<\/p><p>Finally, Miller asked:<\/p><p>\"How do I know you're really Ethan?\"<\/p><p>Ethan looked at him.<\/p><p>\"You don't.\"<\/p><p>Miller raised his weapon slightly.<\/p><p>Ethan didn't move.<\/p><p>\"You were told not to trust me,\" Miller said.<\/p><p>\"I know.\"<\/p><p>\"And yet you came here.\"<\/p><p>\"I had to.\"<\/p><p>\"Why?\"<\/p><p>Ethan looked toward the monitors.<\/p><p>\"Because you're the only person who can finish this.\"<\/p><p>Miller lowered the weapon slightly.<\/p><p>\"Finish what?\"<\/p><p>Ethan pointed toward the corridor.<\/p><p>\"The investigation they started twenty years ago.\"<\/p><p>They walked through the facility.<\/p><p>The deeper they went, the older everything became.<\/p><p>The walls were covered with faded warning signs.<\/p><p>Some had been scratched out.<\/p><p>Others had one word written across them.<\/p><p><b>RECOGNITION.<\/b><\/p><p>Miller stopped.<\/p><p>\"Recognition.\"<\/p><p>Ethan looked at him.<\/p><p>\"You remember that word?\"<\/p><p>Miller shook his head.<\/p><p>\"No.\"<\/p><p>\"You will.\"<\/p><p>They reached a large metal door.<\/p><p>A number was painted across it.<\/p><p><b>01<\/b><\/p><p>Ethan pulled out a key.<\/p><p>The door opened.<\/p><p>Inside was a small room.<\/p><p>There was a desk.<\/p><p>Two chairs.<\/p><p>And a tape recorder.<\/p><p>Miller walked toward it.<\/p><p>A cassette was already inside.<\/p><p>He pressed play.<\/p><p>Static filled the room.<\/p><p>Then a voice.<\/p><p>Thomas Reed.<\/p><p>\"July 3.\"<\/p><p>Miller froze.<\/p><p>Reed continued.<\/p><p>\"If you're listening to this, Miller survived.\"<\/p><p>A pause.<\/p><p>\"I didn't expect him to.\"<\/p><p>Miller looked at Ethan.<\/p><p>The recording continued.<\/p><p>\"The facility called him Subject 11.\"<\/p><p>Miller's face tightened.<\/p><p>\"But that wasn't his real designation.\"<\/p><p>The tape clicked.<\/p><p>Then Reed said:<\/p><p>\"Subject 01.\"<\/p><p>Miller stared at the recorder.<\/p><p>Ethan looked down.<\/p><p>\"What does that mean?\"<\/p><p>Reed answered from the recording.<\/p><p>\"It means Miller was the first.\"<\/p><p>The tape continued.<\/p><p>\"They didn't erase his memories because he failed.\"<\/p><p>A long silence.<\/p><p>\"They erased them because he remembered everything.\"<\/p><p>Miller closed his eyes.<\/p><p>Images returned.<\/p><p>A hallway.<\/p><p>A laboratory.<\/p><p>People screaming.<\/p><p>A young Ethan.<\/p><p>Thomas Reed.<\/p><p>And Miller standing in front of a control room.<\/p><p>Then another memory.<\/p><p>Miller holding a key.<\/p><p>A door marked:<\/p><p><b>SITE 01<\/b><\/p><p>He opened his eyes.<\/p><p>\"I remember.\"<\/p><p>Ethan looked at him.<\/p><p>\"What?\"<\/p><p>Miller stared at the wall.<\/p><p>\"The room.\"<\/p><p>\"What room?\"<\/p><p>\"The one where they kept everyone.\"<\/p><p>He turned toward Ethan.<\/p><p>\"It wasn't under Northbridge.\"<\/p><p>Ethan frowned.<\/p><p>\"Then where?\"<\/p><p>Miller looked at the floor.<\/p><p>\"Here.\"<\/p><p>The building suddenly shook.<\/p><p>Dust fell from the ceiling.<\/p><p>The lights flickered.<\/p><p>A warning alarm began.<\/p><p>Ethan looked toward the door.<\/p><p>\"They know we're here.\"<\/p><p>Miller grabbed the tape recorder.<\/p><p>\"Then we move.\"<\/p><p>They ran into the corridor.<\/p><p>Behind them, metal doors began locking one after another.<\/p><p>Miller and Ethan reached the stairs.<\/p><p>A figure stood at the bottom.<\/p><p>Miller stopped.<\/p><p>The figure stepped into the light.<\/p><p>Thomas Reed.<\/p><p>Alive.<\/p><p>Miller stared at him.<\/p><p>\"You.\"<\/p><p>Reed looked at Ethan.<\/p><p>Then back at Miller.<\/p><p>\"I told you not to come back.\"<\/p><p>Miller raised his weapon.<\/p><p>\"You've been lying to me.\"<\/p><p>Reed nodded.<\/p><p>\"Yes.\"<\/p><p>\"Who are you?\"<\/p><p>Reed looked tired.<\/p><p>\"Someone who failed.\"<\/p><p>Miller stepped closer.<\/p><p>\"What happened twenty years ago?\"<\/p><p>Reed looked at Ethan.<\/p><p>\"Ethan wasn't supposed to be here.\"<\/p><p>Ethan's expression changed.<\/p><p>\"What?\"<\/p><p>Reed continued.<\/p><p>\"The original eleven subjects were chosen for one reason.\"<\/p><p>Miller waited.<\/p><p>\"They could recognize what others couldn't.\"<\/p><p>Miller looked at the walls.<\/p><p>\"Recognize what?\"<\/p><p>Reed's answer was quiet.<\/p><p>\"The truth.\"<\/p><p>The alarm suddenly stopped.<\/p><p>Silence filled the building.<\/p><p>Then every light turned red.<\/p><p>A voice came through the speakers.<\/p><p>Not Reed.<\/p><p>Not Ethan.<\/p><p>Not Miller.<\/p><p>A new voice.<\/p><p>Calm.<\/p><p>Cold.<\/p><p>\"Subject 01 has returned.\"<\/p><p>Miller looked up.<\/p><p>The voice continued.<\/p><p>\"Begin final procedure.\"<\/p><p>Ethan stepped backward.<\/p><p>Reed's face went pale.<\/p><p>Miller looked between them.<\/p><p>\"What is the final procedure?\"<\/p><p>Reed answered.<\/p><p>\"Making you remember.\"<\/p><p>The doors behind them slammed shut.<\/p><p>Miller turned.<\/p><p>There was nowhere to run.<\/p><p>Then the lights went out.<\/p><p><b>End of Chapter 29<\/b><\/p>", "c": "Ethan Cole"}, {"n": 30, "title": "The Final Procedure", "html": "<p>Darkness swallowed the corridor.<\/p><p>Miller could hear Ethan breathing beside him.<\/p><p>Reed was somewhere behind them.<\/p><p>Then the speakers crackled.<\/p><p>\"Subject 01.\"<\/p><p>Miller looked up.<\/p><p>\"Your memory will now be restored.\"<\/p><p>A light switched on.<\/p><p>Then another.<\/p><p>Then another.<\/p><p>The corridor transformed.<\/p><p>The walls around Miller seemed to disappear.<\/p><p>He was standing somewhere else.<\/p><p>Twenty years earlier.<\/p><p>Northbridge Research Facility.<\/p><p>He knew it immediately.<\/p><p>He saw himself younger, standing beside Thomas Reed.<\/p><p>Ethan was there too.<\/p><p>But Ethan was only a teenager.<\/p><p>Miller stared.<\/p><p>\"I remember this.\"<\/p><p>Reed's voice came from behind him.<\/p><p>\"You were never supposed to.\"<\/p><p>The memory continued.<\/p><p>Young Miller opened a metal door.<\/p><p>Behind it were eleven people.<\/p><p>The missing persons.<\/p><p>They were alive.<\/p><p>They were frightened.<\/p><p>And one of them was Ethan.<\/p><p>Miller stepped closer.<\/p><p>\"They were here.\"<\/p><p>Reed nodded.<\/p><p>\"You found them.\"<\/p><p>The memory changed.<\/p><p>Miller saw himself standing in front of a control room.<\/p><p>A scientist was shouting at him.<\/p><p>\"You don't understand what you've done.\"<\/p><p>Young Miller replied:<\/p><p>\"I understand exactly what you've done.\"<\/p><p>Then he pulled a switch.<\/p><p>The facility alarms began.<\/p><p>Doors opened.<\/p><p>The eleven subjects escaped.<\/p><p>Miller remembered running.<\/p><p>He remembered Reed following him.<\/p><p>He remembered Ethan grabbing his hand.<\/p><p>Then the memory stopped.<\/p><p>Miller looked at Reed.<\/p><p>\"What happened after that?\"<\/p><p>Reed didn't answer.<\/p><p>Ethan did.<\/p><p>\"You went back.\"<\/p><p>Miller turned.<\/p><p>\"Why?\"<\/p><p>Ethan looked at the floor.<\/p><p>\"Because someone was still inside.\"<\/p><p>Miller understood.<\/p><p>\"Who?\"<\/p><p>Ethan looked at Reed.<\/p><p>\"Her.\"<\/p><p>A woman appeared at the end of the corridor.<\/p><p>Miller recognized her immediately.<\/p><p>She had appeared in his memories.<\/p><p>The scientist.<\/p><p>She walked toward them.<\/p><p>Older now.<\/p><p>But still alive.<\/p><p>Miller raised his weapon.<\/p><p>She smiled.<\/p><p>\"Put it down.\"<\/p><p>Miller didn't move.<\/p><p>\"You created the cases.\"<\/p><p>\"No.\"<\/p><p>She stopped.<\/p><p>\"I created the first one.\"<\/p><p>Miller stared at her.<\/p><p>\"What do you want?\"<\/p><p>She looked directly at him.<\/p><p>\"You.\"<\/p><p>Ethan stepped forward.<\/p><p>\"Why?\"<\/p><p>The woman looked at him.<\/p><p>\"Because Miller remembers.\"<\/p><p>Miller's eyes narrowed.<\/p><p>\"Remembers what?\"<\/p><p>She smiled.<\/p><p>\"The truth about Thomas Reed.\"<\/p><p>Miller looked at Reed.<\/p><p>Reed didn't speak.<\/p><p>The woman continued.<\/p><p>\"Thomas Reed wasn't a victim.\"<\/p><p>Miller's expression changed.<\/p><p>\"He was one of us.\"<\/p><p>Silence.<\/p><p>Miller turned toward Reed.<\/p><p>\"Is that true?\"<\/p><p>Reed finally looked at him.<\/p><p>\"Yes.\"<\/p><p>Ethan stepped backward.<\/p><p>\"You lied to me.\"<\/p><p>\"I had to.\"<\/p><p>Miller raised his weapon.<\/p><p>\"Twenty years ago, you helped them.\"<\/p><p>Reed nodded.<\/p><p>\"Yes.\"<\/p><p>\"Then why did you help me?\"<\/p><p>\"Because I changed my mind.\"<\/p><p>The woman laughed quietly.<\/p><p>\"You didn't change.\"<\/p><p>Reed looked at her.<\/p><p>\"I chose a side.\"<\/p><p>The facility shook again.<\/p><p>A warning alarm sounded.<\/p><p>The woman turned toward the control room.<\/p><p>\"The procedure is complete.\"<\/p><p>Miller looked around.<\/p><p>\"What procedure?\"<\/p><p>She pressed a button.<\/p><p>Every screen in the facility switched on.<\/p><p>The eleven missing people appeared.<\/p><p>Alive.<\/p><p>All of them.<\/p><p>Then the screens changed.<\/p><p>Ethan's face.<\/p><p>Reed's face.<\/p><p>Miller's face.<\/p><p>The woman spoke.<\/p><p>\"The cases were never about finding missing people.\"<\/p><p>Miller stared at the screens.<\/p><p>\"They were about finding you.\"<\/p><p>Miller's eyes hardened.<\/p><p>\"Why?\"<\/p><p>She looked directly at him.<\/p><p>\"Because you're the only person who escaped with the complete memory.\"<\/p><p>Miller looked at Ethan.<\/p><p>Then Reed.<\/p><p>Then the screens.<\/p><p>Everything finally connected.<\/p><p>The disappearances.<\/p><p>The archive.<\/p><p>The photographs.<\/p><p>The messages.<\/p><p>They had all been leading back to him.<\/p><p>The woman pressed another button.<\/p><p>A large door opened at the end of the corridor.<\/p><p>Beyond it was a room Miller remembered.<\/p><p>The room where everything had started.<\/p><p>The woman smiled.<\/p><p>\"Welcome home, Subject 01.\"<\/p><p>Miller stepped forward.<\/p><p>Ethan followed.<\/p><p>Reed stayed behind.<\/p><p>Miller looked back.<\/p><p>\"Reed.\"<\/p><p>Reed met his eyes.<\/p><p>\"If you stay here, they'll kill you.\"<\/p><p>Reed shook his head.<\/p><p>\"Someone has to close the door.\"<\/p><p>Miller understood.<\/p><p>He turned toward the room.<\/p><p>The final door began closing behind them.<\/p><p>Ethan looked at Miller.<\/p><p>\"What happens now?\"<\/p><p>Miller stared into the darkness ahead.<\/p><p>\"The truth.\"<\/p><p>The door slammed shut.<\/p><p>And for the first time in twenty years...<\/p><p>Miller remembered everything.<\/p><p><b>End of Chapter 30<\/b><\/p>", "c": "Ethan Cole"}, {"n": 31, "title": "Everything", "html": "<p>Miller stood inside the room.<\/p><p>For a few seconds, he couldn't breathe.<\/p><p>Everything came back at once.<\/p><p>The facility.<\/p><p>The experiments.<\/p><p>The people.<\/p><p>The eleven subjects.<\/p><p>And the night he had tried to destroy it all.<\/p><p>Ethan stood beside him.<\/p><p>\"What do you remember?\"<\/p><p>Miller didn't answer.<\/p><p>He walked toward the center of the room.<\/p><p>There was a table.<\/p><p>On it sat an old photograph.<\/p><p>Miller picked it up.<\/p><p>It showed eleven people standing together.<\/p><p>Ethan was there.<\/p><p>Thomas Reed was there.<\/p><p>And Miller.<\/p><p>On the back was a date.<\/p><p><b>August 17, 2006.<\/b><\/p><p>Twenty years ago.<\/p><p>Miller remembered.<\/p><p>The woman who ran the facility had called the experiment <b>Recognition<\/b>.<\/p><p>The subjects were exposed to different situations.<\/p><p>Fear.<\/p><p>Isolation.<\/p><p>Manipulation.<\/p><p>They were studying how people recognized patterns when they had incomplete information.<\/p><p>But the experiment changed.<\/p><p>The researchers began creating the situations themselves.<\/p><p>People disappeared.<\/p><p>Cases were manufactured.<\/p><p>Evidence was planted.<\/p><p>Memories were altered.<\/p><p>The missing persons weren't random.<\/p><p>They were subjects.<\/p><p>Miller had discovered the truth.<\/p><p>And he had tried to stop it.<\/p><p>Ethan looked at him.<\/p><p>\"Why did you erase your own memory?\"<\/p><p>Miller finally answered.<\/p><p>\"Because I knew they would come after me.\"<\/p><p>\"And Reed?\"<\/p><p>Miller looked toward the door.<\/p><p>\"He helped me escape.\"<\/p><p>Ethan frowned.<\/p><p>\"But he worked for them.\"<\/p><p>\"At first.\"<\/p><p>Miller put the photograph down.<\/p><p>\"He was one of the people who built the system.\"<\/p><p>\"Then why help you?\"<\/p><p>\"Because his daughter was one of the subjects.\"<\/p><p>Ethan went silent.<\/p><p>Miller remembered her face.<\/p><p>A girl who had disappeared before the others.<\/p><p>The first victim.<\/p><p>The first case.<\/p><p>The reason Reed had turned against the facility.<\/p><p>Then the speakers activated.<\/p><p>The woman's voice filled the room.<\/p><p>\"You remember now.\"<\/p><p>Miller looked up.<\/p><p>\"Yes.\"<\/p><p>\"Then you know what happens next.\"<\/p><p>Miller walked toward the control panel.<\/p><p>\"I know what happened twenty years ago.\"<\/p><p>He stopped.<\/p><p>\"But I don't know what you're doing now.\"<\/p><p>The woman laughed.<\/p><p>\"You're still thinking too small.\"<\/p><p>A screen activated.<\/p><p>A map appeared.<\/p><p>Hundreds of locations were marked across the country.<\/p><p>Miller stared.<\/p><p>\"This isn't one facility.\"<\/p><p>\"No.\"<\/p><p>The woman spoke calmly.<\/p><p>\"It's a network.\"<\/p><p>Ethan stepped closer.<\/p><p>\"How many?\"<\/p><p>The screen changed.<\/p><p><b>47 ACTIVE LOCATIONS<\/b><\/p><p>Miller's expression hardened.<\/p><p>\"How many subjects?\"<\/p><p>Another number appeared.<\/p><p><b>1,204<\/b><\/p><p>Ethan stared at the screen.<\/p><p>\"That's impossible.\"<\/p><p>Miller shook his head.<\/p><p>\"No.\"<\/p><p>He remembered something else.<\/p><p>The original experiment hadn't ended.<\/p><p>It had expanded.<\/p><p>The cases Miller had investigated over the years weren't isolated incidents.<\/p><p>They were fragments of the same system.<\/p><p>The woman spoke again.<\/p><p>\"You've spent years solving cases.\"<\/p><p>Miller looked at the screen.<\/p><p>\"You were never solving them.\"<\/p><p>The map began changing.<\/p><p>Locations disappeared one after another.<\/p><p>Then one remained.<\/p><p>Northbridge.<\/p><p>Miller looked at Ethan.<\/p><p>\"Why Northbridge?\"<\/p><p>The woman answered.<\/p><p>\"Because that's where it ends.\"<\/p><p>The lights went out.<\/p><p>A door opened at the far side of the room.<\/p><p>Miller and Ethan stepped through.<\/p><p>They entered a massive underground chamber.<\/p><p>Rows of computers stretched into the darkness.<\/p><p>Every screen displayed the same word.<\/p><p><b>RECOGNITION<\/b><\/p><p>Then the screens changed.<\/p><p>A single message appeared.<\/p><p><b>FINAL SUBJECT IDENTIFIED.<\/b><\/p><p>Miller stopped.<\/p><p>The woman's voice came through one final time.<\/p><p>\"Subject 01.\"<\/p><p>Miller looked toward the ceiling.<\/p><p>\"Your case is now complete.\"<\/p><p>A countdown appeared.<\/p><p><b>10<\/b><\/p><p>Ethan looked at Miller.<\/p><p>\"What is that?\"<\/p><p>Miller watched the numbers fall.<\/p><p><b>9<\/b><\/p><p>\"I don't know.\"<\/p><p><b>8<\/b><\/p><p>Reed's voice suddenly came through the speakers.<\/p><p>\"Miller!\"<\/p><p>Miller turned.<\/p><p><b>7<\/b><\/p><p>\"Get out!\"<\/p><p><b>6<\/b><\/p><p>The facility began shaking.<\/p><p><b>5<\/b><\/p><p>Miller grabbed Ethan.<\/p><p>\"Run.\"<\/p><p><b>4<\/b><\/p><p>They sprinted toward the exit.<\/p><p><b>3<\/b><\/p><p>The alarms screamed.<\/p><p><b>2<\/b><\/p><p>Miller looked back.<\/p><p>Every screen went black.<\/p><p><b>1<\/b><\/p><p>A final message appeared.<\/p><p><b>THE CYCLE BEGINS AGAIN.<\/b><\/p><p>The entire facility went dark.<\/p><p>Miller and Ethan disappeared into the tunnel.<\/p><p>Behind them, the doors locked.<\/p><p>And somewhere in the darkness...<\/p><p>a new case file opened.<\/p><p><b>CASE 12.<\/b><\/p><p><b>End of Chapter 31<\/b><\/p>", "c": "Ethan Cole"}, {"n": 32, "title": "Case 12", "html": "<p>Miller and Ethan ran through the tunnel.<\/p><p>The alarms had stopped.<\/p><p>That was worse.<\/p><p>The silence felt deliberate.<\/p><p>They reached the maintenance stairs and climbed.<\/p><p>Miller pushed open the final door.<\/p><p>Morning light flooded the corridor.<\/p><p>They were back inside Northbridge Station.<\/p><p>For a moment, neither of them moved.<\/p><p>Ethan looked behind them.<\/p><p>\"Did we stop it?\"<\/p><p>Miller shook his head.<\/p><p>\"No.\"<\/p><p>They walked onto the platform.<\/p><p>People were beginning to arrive.<\/p><p>Trains moved through the station.<\/p><p>Everything looked normal.<\/p><p>Almost painfully normal.<\/p><p>Miller checked his phone.<\/p><p>No signal.<\/p><p>Then it returned.<\/p><p>Twenty-three missed calls.<\/p><p>All from the same number.<\/p><p><b>THOMAS REED<\/b><\/p><p>Miller immediately called back.<\/p><p>The phone rang once.<\/p><p>Then Reed answered.<\/p><p>\"Miller.\"<\/p><p>\"Where are you?\"<\/p><p>\"Somewhere they can't find me.\"<\/p><p>Miller looked around the station.<\/p><p>\"Did you know about the forty-seven locations?\"<\/p><p>A pause.<\/p><p>\"Yes.\"<\/p><p>Miller's expression hardened.<\/p><p>\"You knew?\"<\/p><p>\"I discovered them years ago.\"<\/p><p>\"Why didn't you tell me?\"<\/p><p>\"Because you had already forgotten.\"<\/p><p>Miller said nothing.<\/p><p>Reed continued.<\/p><p>\"The facility you entered wasn't the main operation.\"<\/p><p>\"Then what was it?\"<\/p><p>\"The control center.\"<\/p><p>Miller stopped walking.<\/p><p>\"And the other forty-seven?\"<\/p><p>\"They're still active.\"<\/p><p>Ethan stepped closer.<\/p><p>\"How do we stop them?\"<\/p><p>Reed went silent.<\/p><p>Then he said:<\/p><p>\"You can't.\"<\/p><p>The call ended.<\/p><p>Miller stared at the phone.<\/p><p>Ethan looked at him.<\/p><p>\"What now?\"<\/p><p>Miller looked toward the station exit.<\/p><p>\"We find the others.\"<\/p><p>They left the station.<\/p><p>Outside, the city was waking up.<\/p><p>Cars filled the roads.<\/p><p>People walked to work.<\/p><p>Nobody knew what was happening beneath them.<\/p><p>Miller and Ethan reached his car.<\/p><p>Before Miller could unlock it, his phone vibrated.<\/p><p>A new message.<\/p><p>Unknown number.<\/p><p>Miller opened it.<\/p><p>There was a photograph.<\/p><p>A young woman standing outside a school.<\/p><p>Beneath the photograph:<\/p><p><b>CASE 12<\/b><\/p><p><b>NAME: EMILY HARPER<\/b><\/p><p><b>AGE: 17<\/b><\/p><p><b>LAST SEEN: TODAY<\/b><\/p><p>Miller stared at the screen.<\/p><p>Ethan looked over his shoulder.<\/p><p>\"Another missing person.\"<\/p><p>Miller shook his head.<\/p><p>\"No.\"<\/p><p>He zoomed in on the photograph.<\/p><p>There was something in the background.<\/p><p>A familiar symbol.<\/p><p>The same symbol from the photographs in the underground archive.<\/p><p>Miller's expression changed.<\/p><p>\"They've already started.\"<\/p><p>Another message appeared.<\/p><p><b>YOU HAVE 24 HOURS.<\/b><\/p><p>Then another.<\/p><p><b>FIND HER BEFORE THEY DO.<\/b><\/p><p>Miller put the phone away.<\/p><p>Ethan looked at him.<\/p><p>\"Where is she?\"<\/p><p>Miller looked at the photograph again.<\/p><p>The location was visible in the corner.<\/p><p>A school.<\/p><p><b>Northbridge Academy.<\/b><\/p><p>Miller started the car.<\/p><p>They drove.<\/p><p>Neither noticed the black vehicle parked across the street.<\/p><p>Inside, someone watched them leave.<\/p><p>A phone rang.<\/p><p>The person answered.<\/p><p>\"He's moving.\"<\/p><p>A voice replied:<\/p><p>\"Good.\"<\/p><p>The person looked down at a file.<\/p><p>On the cover were two words.<\/p><p><b>CASE 12<\/b><\/p><p>They opened it.<\/p><p>Inside was Emily Harper's photograph.<\/p><p>But beneath her name was something that shouldn't have been there.<\/p><p>A second name.<\/p><p><b>MILLER<\/b><\/p><p>The person smiled.<\/p><p>\"He's going exactly where we wanted.\"<\/p><p>The file closed.<\/p><p>The black vehicle started.<\/p><p>And followed.<\/p><p><b>End of Chapter 32<\/b><\/p>", "c": "Ethan Cole"}, {"n": 33, "title": "Emily Harper", "html": "<p>Miller pulled up outside Northbridge Academy.<\/p><p>Students were leaving through the main entrance.<\/p><p>Teachers stood near the doors.<\/p><p>Parents waited in cars.<\/p><p>Everything looked ordinary.<\/p><p>That was the problem.<\/p><p>Miller checked the photograph again.<\/p><p>Emily Harper.<\/p><p>Seventeen.<\/p><p>Last seen today.<\/p><p>He looked across the school grounds.<\/p><p>\"Where do we start?\"<\/p><p>Ethan pointed toward the administration building.<\/p><p>\"Missing students get reported there.\"<\/p><p>They entered.<\/p><p>Miller showed his badge.<\/p><p>A secretary looked up.<\/p><p>\"Can I help you?\"<\/p><p>\"I'm Detective Miller. We're looking for Emily Harper.\"<\/p><p>The secretary's expression changed.<\/p><p>\"Emily?\"<\/p><p>\"Yes.\"<\/p><p>\"She was here this morning.\"<\/p><p>Miller leaned forward.<\/p><p>\"When did you last see her?\"<\/p><p>\"During first period.\"<\/p><p>\"Did she leave the school?\"<\/p><p>\"I don't know.\"<\/p><p>\"Was she alone?\"<\/p><p>The secretary hesitated.<\/p><p>\"She was with someone.\"<\/p><p>\"Who?\"<\/p><p>Before she could answer, a man appeared behind them.<\/p><p>\"Emily Harper?\"<\/p><p>Miller turned.<\/p><p>The man was wearing a school security uniform.<\/p><p>\"She left about an hour ago.\"<\/p><p>\"With who?\"<\/p><p>The guard looked at Ethan.<\/p><p>Then Miller.<\/p><p>\"I don't know.\"<\/p><p>Miller studied him.<\/p><p>\"What's your name?\"<\/p><p>\"Daniel.\"<\/p><p>\"Last name?\"<\/p><p>The guard hesitated.<\/p><p>\"Daniel Brooks.\"<\/p><p>Miller noticed something.<\/p><p>A small black symbol was printed on the guard's identification card.<\/p><p>The same symbol.<\/p><p>Miller reached for it.<\/p><p>The guard stepped back.<\/p><p>\"Don't touch that.\"<\/p><p>Miller stared at him.<\/p><p>\"Why?\"<\/p><p>The guard said nothing.<\/p><p>Ethan suddenly grabbed Miller's arm.<\/p><p>\"Come on.\"<\/p><p>They walked away.<\/p><p>\"What was that?\" Ethan asked.<\/p><p>Miller looked back.<\/p><p>\"That symbol.\"<\/p><p>Ethan nodded.<\/p><p>\"They're here.\"<\/p><p>Miller looked down the hallway.<\/p><p>\"We need to find Emily.\"<\/p><p>They searched the school.<\/p><p>Classrooms.<\/p><p>Library.<\/p><p>Gym.<\/p><p>Nothing.<\/p><p>Then Miller noticed a door at the end of a hallway.<\/p><p><b>AUTHORIZED PERSONNEL ONLY<\/b><\/p><p>He opened it.<\/p><p>A staircase led underground.<\/p><p>Ethan stared.<\/p><p>\"There's another facility.\"<\/p><p>Miller nodded.<\/p><p>\"Or an entrance.\"<\/p><p>They went down.<\/p><p>At the bottom was a small room.<\/p><p>Empty.<\/p><p>Except for a chair.<\/p><p>And a camera.<\/p><p>Miller looked at it.<\/p><p>The camera turned toward him.<\/p><p>A screen switched on.<\/p><p>Emily appeared.<\/p><p>She was sitting in a dark room.<\/p><p>Her hands were tied.<\/p><p>Miller stepped closer.<\/p><p>\"Emily!\"<\/p><p>She looked at the camera.<\/p><p>\"Who are you?\"<\/p><p>\"Miller. We're here to get you out.\"<\/p><p>Emily shook her head.<\/p><p>\"No.\"<\/p><p>Miller frowned.<\/p><p>\"What?\"<\/p><p>\"Don't come here.\"<\/p><p>\"Where are you?\"<\/p><p>\"I don't know.\"<\/p><p>Ethan stepped closer.<\/p><p>\"Emily, listen to us.\"<\/p><p>She looked at him.<\/p><p>Then her expression changed.<\/p><p>\"You.\"<\/p><p>Ethan froze.<\/p><p>\"Do I know you?\"<\/p><p>Emily shook her head.<\/p><p>\"No.\"<\/p><p>She looked frightened.<\/p><p>\"They showed me your picture.\"<\/p><p>Miller's eyes narrowed.<\/p><p>\"Who?\"<\/p><p>Emily looked toward something off-screen.<\/p><p>\"The people who took the others.\"<\/p><p>Miller asked:<\/p><p>\"What did they tell you?\"<\/p><p>Emily whispered:<\/p><p>\"They said you would come.\"<\/p><p>The screen suddenly went black.<\/p><p>Miller turned toward Ethan.<\/p><p>\"They expected us.\"<\/p><p>Ethan nodded.<\/p><p>A door opened behind them.<\/p><p>Daniel Brooks stood there.<\/p><p>Miller raised his weapon.<\/p><p>Daniel didn't move.<\/p><p>\"You need to leave.\"<\/p><p>Miller stared at him.<\/p><p>\"Where is Emily?\"<\/p><p>\"She's not here.\"<\/p><p>\"Then where is she?\"<\/p><p>Daniel looked toward the screen.<\/p><p>\"You're already too late.\"<\/p><p>Miller stepped closer.<\/p><p>\"Tell me where she is.\"<\/p><p>Daniel's face changed.<\/p><p>\"She's at the original site.\"<\/p><p>Miller went still.<\/p><p>\"Site-01?\"<\/p><p>Daniel nodded.<\/p><p>\"Recognition.\"<\/p><p>Ethan looked at Miller.<\/p><p>\"We destroyed that place.\"<\/p><p>Daniel shook his head.<\/p><p>\"You destroyed one entrance.\"<\/p><p>Miller's expression hardened.<\/p><p>\"Where is the real facility?\"<\/p><p>Daniel looked toward the ceiling.<\/p><p>\"Under the city.\"<\/p><p>The lights went out.<\/p><p>A gunshot echoed through the corridor.<\/p><p>Daniel collapsed.<\/p><p>Miller rushed forward.<\/p><p>Ethan looked around.<\/p><p>\"Where did that come from?\"<\/p><p>Miller checked Daniel.<\/p><p>He was dead.<\/p><p>A small piece of paper lay beside him.<\/p><p>Miller picked it up.<\/p><p>Three words were written on it.<\/p><p><b>DON'T TRUST ETHAN.<\/b><\/p><p>Miller slowly looked at Ethan.<\/p><p>Ethan stared at the message.<\/p><p>\"I didn't kill him.\"<\/p><p>Miller didn't answer.<\/p><p>His phone vibrated.<\/p><p>A new message.<\/p><p><b>CASE 12 HAS MOVED.<\/b><\/p><p>Then another.<\/p><p><b>SO SHOULD YOU.<\/b><\/p><p>Miller looked toward the dark staircase.<\/p><p>Somewhere beneath the school, a door opened.<\/p><p>And from deep underground came the sound of footsteps.<\/p><p>Coming toward them.<\/p><p><b>End of Chapter 33<\/b><\/p>", "c": "Ethan Cole"}, {"n": 34, "title": "The End", "html": "<p>The doors slammed shut.<\/p><p>Miller stood in the center of the underground facility, staring at the eleven people standing across from him.<\/p><p>Ethan was beside him.<\/p><p>Emily Harper stood among the others.<\/p><p>Thomas Reed was there too.<\/p><p>And behind the glass of the control room, the person who had been watching them smiled.<\/p><p>Miller looked at the screen.<\/p><p>The countdown was gone.<\/p><p>There was no number.<\/p><p>No timer.<\/p><p>No final procedure.<\/p><p>Only one message remained.<\/p><p>WELCOME BACK, MILLER.<\/p><p>Miller stared at it.<\/p><p>Then he understood.<\/p><p>\"They didn't bring me here to kill me.\"<\/p><p>Ethan looked at him.<\/p><p>\"Then why?\"<\/p><p>Miller looked at the eleven people.<\/p><p>\"To finish the case.\"<\/p><p>A door opened at the far end of the room.<\/p><p>Someone walked through.<\/p><p>Miller immediately recognized him.<\/p><p>He lowered his weapon.<\/p><p>\"Daniel Carter.\"<\/p><p>Carter stopped.<\/p><p>He looked exhausted, but alive.<\/p><p>Ethan stared at him.<\/p><p>\"You're alive.\"<\/p><p>Carter nodded.<\/p><p>\"Room 19 wasn't the end.\"<\/p><p>Miller walked toward him.<\/p><p>\"What happened after I found you?\"<\/p><p>Carter looked toward the control room.<\/p><p>\"They found me before I could get out.\"<\/p><p>\"You disappeared.\"<\/p><p>\"I was taken.\"<\/p><p>Miller's expression hardened.<\/p><p>\"Why didn't you contact me?\"<\/p><p>\"Because I couldn't.\"<\/p><p>Carter reached inside his coat and pulled out a small black folder.<\/p><p>\"I kept this.\"<\/p><p>Miller took it.<\/p><p>The front contained a single name.<\/p><p>ALAN COLE.<\/p><p>Miller froze.<\/p><p>Alan.<\/p><p>The name that had started everything.<\/p><p>Carter opened the folder.<\/p><p>Inside were photographs Miller had never seen.<\/p><p>Alan standing outside a building.<\/p><p>Alan meeting someone.<\/p><p>Alan entering a car.<\/p><p>And one final photograph.<\/p><p>Alan standing beside a younger Ethan.<\/p><p>Miller looked at Ethan.<\/p><p>\"You knew Alan.\"<\/p><p>Ethan nodded.<\/p><p>\"He was trying to protect me.\"<\/p><p>Miller looked back at the photograph.<\/p><p>\"From Recognition.\"<\/p><p>Carter nodded.<\/p><p>\"Alan found out about the organization before anyone else.\"<\/p><p>Miller remembered the beginning.<\/p><p>Alan's laptop.<\/p><p>The strange code.<\/p><p>My cat is beyond the horizon.<\/p><p>The message that had started the entire investigation.<\/p><p>Alan had known he was in danger.<\/p><p>He had known someone was hunting him.<\/p><p>And he had tried to leave a trail.<\/p><p>Carter continued.<\/p><p>\"Alan discovered that people weren't simply disappearing.\"<\/p><p>Miller looked at him.<\/p><p>\"They were being moved.\"<\/p><p>\"Yes.\"<\/p><p>\"To the facilities.\"<\/p><p>\"Yes.\"<\/p><p>\"Site-01.\"<\/p><p>Carter nodded.<\/p><p>\"And Alan found Ethan.\"<\/p><p>Ethan looked down.<\/p><p>\"Alan knew what they were doing to us.\"<\/p><p>Miller's voice became quieter.<\/p><p>\"Why didn't Alan run?\"<\/p><p>Carter answered:<\/p><p>\"Because he knew someone had to expose them.\"<\/p><p>Silence filled the room.<\/p><p>Miller looked at Alan's photograph.<\/p><p>The first case wasn't the beginning.<\/p><p>It was the first warning.<\/p><p>Alan hadn't been trying to solve the mystery.<\/p><p>He had been trying to leave enough evidence behind for someone else to finish it.<\/p><p>Miller closed his eyes.<\/p><p>For years, he had asked the same question.<\/p><p>Why?<\/p><p>Now he finally had the answer.<\/p><p>Because Alan knew nobody would believe him unless there was evidence.<\/p><p>And he had died making sure that evidence survived.<\/p><p>Miller turned toward the control room.<\/p><p>\"You used Alan.\"<\/p><p>The woman behind the glass didn't answer.<\/p><p>\"You watched him.\"<\/p><p>Silence.<\/p><p>\"You followed him.\"<\/p><p>Still nothing.<\/p><p>\"You killed him.\"<\/p><p>The woman finally spoke.<\/p><p>\"Alan Cole was a problem.\"<\/p><p>Miller's expression hardened.<\/p><p>\"He was a person.\"<\/p><p>\"He knew too much.\"<\/p><p>\"So you removed him.\"<\/p><p>\"He refused to cooperate.\"<\/p><p>Miller looked at Alan's photograph.<\/p><p>\"And then you created the Mercer case.\"<\/p><p>The woman's expression changed.<\/p><p>Miller knew he had found the next piece.<\/p><p>Ryan Mercer.<\/p><p>The man who had spent years carrying the weight of a murder he didn't commit.<\/p><p>The man whose initials had appeared on the bracelet.<\/p><p>The man Miller had once believed could be responsible.<\/p><p>Carter spoke.<\/p><p>\"They needed someone to take the blame.\"<\/p><p>Miller nodded.<\/p><p>\"Ryan was perfect.\"<\/p><p>\"He was Alan's best friend.\"<\/p><p>\"He had motive.\"<\/p><p>\"He knew Alan.\"<\/p><p>\"He had been seen near him.\"<\/p><p>\"And the bracelet.\"<\/p><p>Carter shook his head.<\/p><p>\"Placed.\"<\/p><p>Miller looked at the screen.<\/p><p>\"The evidence was manufactured.\"<\/p><p>\"Most of it.\"<\/p><p>Miller's jaw tightened.<\/p><p>\"And the rest?\"<\/p><p>\"The real evidence was altered.\"<\/p><p>Miller stared at him.<\/p><p>\"Ryan wasn't the killer.\"<\/p><p>Carter shook his head.<\/p><p>\"No.\"<\/p><p>Miller looked down.<\/p><p>He remembered Ryan's first interview.<\/p><p>The fear.<\/p><p>The shaking hands.<\/p><p>The words:<\/p><p>If anything happens to me... don't trust everything you read.<\/p><p>Miller had thought Ryan was hiding guilt.<\/p><p>He hadn't been.<\/p><p>He had been hiding fear.<\/p><p>Miller finally understood what Alan had meant.<\/p><p>Don't trust everything you read.<\/p><p>The case files had been designed to tell Miller a story.<\/p><p>A false one.<\/p><p>And he had believed it.<\/p><p>Until now.<\/p><p>The door to the control room opened.<\/p><p>The woman stepped out.<\/p><p>Miller recognized her from the old photographs.<\/p><p>She had been there from the beginning.<\/p><p>She had watched Alan.<\/p><p>She had watched Miller.<\/p><p>She had watched every case.<\/p><p>\"You think knowing the truth changes anything?\" she asked.<\/p><p>Miller looked at her.<\/p><p>\"It changes everything.\"<\/p><p>She smiled.<\/p><p>\"You still don't know who killed Alan.\"<\/p><p>Miller paused.<\/p><p>That was true.<\/p><p>The exact person who had carried out Alan's murder had never been identified.<\/p><p>But Miller no longer needed a convenient answer.<\/p><p>The investigation had uncovered something bigger.<\/p><p>The organization had created the conditions.<\/p><p>They had tracked Alan.<\/p><p>They had manipulated the evidence.<\/p><p>They had covered up the murder.<\/p><p>They had framed Ryan Mercer.<\/p><p>They had taken Ethan.<\/p><p>They had erased witnesses.<\/p><p>They had buried the truth.<\/p><p>The crime wasn't one person's secret.<\/p><p>It was an entire system.<\/p><p>Miller looked at the woman.<\/p><p>\"You're right.\"<\/p><p>She smiled.<\/p><p>Then Miller continued:<\/p><p>\"I don't know which hand held the weapon.\"<\/p><p>Her smile disappeared.<\/p><p>\"But I know who ordered it.\"<\/p><p>He pointed toward her.<\/p><p>\"And I know who helped.\"<\/p><p>The room became silent.<\/p><p>Miller pulled out his phone.<\/p><p>The recordings were still there.<\/p><p>The files from the archive.<\/p><p>The photographs.<\/p><p>The conversations.<\/p><p>The evidence.<\/p><p>Everything.<\/p><p>He had been collecting pieces without realizing how important they were.<\/p><p>Carter had preserved the evidence from Room 19.<\/p><p>Reed had preserved the evidence from the old investigation.<\/p><p>Alan had left his original trail.<\/p><p>Emily had survived.<\/p><p>Ethan had survived.<\/p><p>The eleven subjects had survived.<\/p><p>And Miller had finally connected them.<\/p><p>The truth had survived with them.<\/p><p>Miller connected his phone to the system.<\/p><p>A file transfer began.<\/p><p>UPLOADING EVIDENCE<\/p><p>12%<\/p><p>The woman looked at the screen.<\/p><p>\"What are you doing?\"<\/p><p>\"Ending this.\"<\/p><p>29%<\/p><p>She moved toward him.<\/p><p>Carter stepped between them.<\/p><p>\"Don't.\"<\/p><p>She stopped.<\/p><p>47%<\/p><p>Emily looked at Miller.<\/p><p>\"Will this be enough?\"<\/p><p>Miller looked at the screen.<\/p><p>\"It has to be.\"<\/p><p>68%<\/p><p>Ethan looked at the others.<\/p><p>\"They'll know everything.\"<\/p><p>Miller nodded.<\/p><p>\"That's the point.\"<\/p><p>83%<\/p><p>Thomas Reed stepped forward.<\/p><p>\"I spent twenty years waiting for this.\"<\/p><p>Miller looked at him.<\/p><p>\"So did I.\"<\/p><p>100%<\/p><p>The screen changed.<\/p><p>TRANSFER COMPLETE<\/p><p>For a moment, nothing happened.<\/p><p>Then every computer in the facility shut down.<\/p><p>The lights went out.<\/p><p>The entire building went silent.<\/p><p>The woman stared at the dead screens.<\/p><p>\"It's over.\"<\/p><p>Miller looked at her.<\/p><p>\"Yes.\"<\/p><p>An alarm suddenly sounded.<\/p><p>The building shook.<\/p><p>Carter looked toward the ceiling.<\/p><p>\"The facility is collapsing.\"<\/p><p>Miller turned to the survivors.<\/p><p>\"Everyone out.\"<\/p><p>They ran.<\/p><p>The tunnel shook beneath their feet.<\/p><p>Concrete cracked.<\/p><p>Dust filled the air.<\/p><p>Emily stumbled.<\/p><p>Ethan caught her.<\/p><p>\"Keep moving.\"<\/p><p>\"I am.\"<\/p><p>Carter led them toward the exit.<\/p><p>Reed stayed at the back.<\/p><p>Miller looked behind him.<\/p><p>The old facility was collapsing.<\/p><p>The place where Alan had died.<\/p><p>The place where Ethan had been held.<\/p><p>The place where the missing had disappeared.<\/p><p>The place where the truth had been buried.<\/p><p>Miller stopped for half a second.<\/p><p>Then he ran.<\/p><p>They reached the surface.<\/p><p>Seconds later, the entrance collapsed.<\/p><p>The ground shook.<\/p><p>Then silence.<\/p><p>Everyone stood there.<\/p><p>Alive.<\/p><p>Miller looked around.<\/p><p>Ethan.<\/p><p>Emily.<\/p><p>Carter.<\/p><p>Reed.<\/p><p>The eleven survivors.<\/p><p>All of them had made it out.<\/p><p>For once, nobody was missing.<\/p><p>Hours later, police vehicles surrounded the area.<\/p><p>Investigators recovered what they could from the remains.<\/p><p>The files Miller had uploaded were already spreading.<\/p><p>The truth could no longer be contained.<\/p><p>The names of the missing were released.<\/p><p>The existence of Recognition was exposed.<\/p><p>The people responsible were arrested.<\/p><p>And one case was reopened immediately.<\/p><p>RYAN MERCER.<\/p><p>Ryan sat in an interrogation room.<\/p><p>He looked at Miller through the glass.<\/p><p>Miller entered.<\/p><p>Ryan stood.<\/p><p>\"What happened?\"<\/p><p>Miller placed a folder on the table.<\/p><p>Ryan looked at it.<\/p><p>His own name was printed on the front.<\/p><p>He didn't touch it.<\/p><p>\"I didn't kill Alan.\"<\/p><p>Miller sat down.<\/p><p>\"I know.\"<\/p><p>Ryan stared at him.<\/p><p>\"You believe me?\"<\/p><p>\"I should have believed you years ago.\"<\/p><p>Ryan looked down.<\/p><p>Miller opened the folder.<\/p><p>\"The evidence against you was manipulated.\"<\/p><p>Ryan didn't speak.<\/p><p>\"The bracelet was planted.\"<\/p><p>Ryan's eyes lifted.<\/p><p>\"The records were altered.\"<\/p><p>Silence.<\/p><p>\"The investigation was designed to make you look guilty.\"<\/p><p>Ryan swallowed.<\/p><p>\"And Alan?\"<\/p><p>Miller looked at him.<\/p><p>\"Alan was trying to expose them.\"<\/p><p>Ryan closed his eyes.<\/p><p>For years, he had lived with the same question.<\/p><p>Why had Alan been taken from him?<\/p><p>Now he knew.<\/p><p>It didn't make the loss disappear.<\/p><p>But at least the lie was gone.<\/p><p>Miller pushed the folder toward him.<\/p><p>\"You're cleared.\"<\/p><p>Ryan stared at the papers.<\/p><p>\"That's it?\"<\/p><p>\"No.\"<\/p><p>Miller shook his head.<\/p><p>\"That's the beginning of the truth.\"<\/p><p>Ryan looked at him.<\/p><p>\"Did you find who killed him?\"<\/p><p>Miller paused.<\/p><p>\"Not the individual who carried it out.\"<\/p><p>Ryan's face fell.<\/p><p>\"But we found who was behind the operation.\"<\/p><p>Ryan nodded slowly.<\/p><p>\"Alan would have wanted that.\"<\/p><p>Miller stood.<\/p><p>Before leaving, he said:<\/p><p>\"Alan was right about one thing.\"<\/p><p>Ryan looked at him.<\/p><p>\"What's that?\"<\/p><p>Miller answered:<\/p><p>\"You can't trust everything you read.\"<\/p><p>Then he left.<\/p><p>Several months passed.<\/p><p>The surviving subjects were returned to their families.<\/p><p>Emily Harper was reunited with hers.<\/p><p>Her case was officially closed.<\/p><p>CASE 12: FOUND.<\/p><p>Daniel Carter gave his full statement.<\/p><p>The evidence from Room 19 became part of the official investigation.<\/p><p>His disappearance was finally explained.<\/p><p>DANIEL CARTER: FOUND.<\/p><p>Thomas Reed testified against Recognition.<\/p><p>He no longer had to hide.<\/p><p>THOMAS REED: FOUND.<\/p><p>Ethan Cole finally went home.<\/p><p>He had spent years being treated as a number.<\/p><p>Now he had his name back.<\/p><p>ETHAN COLE: FOUND.<\/p><p>And Alan Cole's original case was rewritten.<\/p><p>Not as the case of a mysterious victim.<\/p><p>Not as an unsolved murder buried beneath years of lies.<\/p><p>But as the case that exposed everything.<\/p><p>ALAN COLE: TRUTH ESTABLISHED.<\/p><p>Ryan Mercer was cleared.<\/p><p>RYAN MERCER: INNOCENT.<\/p><p>The eleven missing subjects were identified.<\/p><p>ALL ELEVEN: FOUND.<\/p><p>For the first time, every name had an answer.<\/p><p>Miller returned to his office late one evening.<\/p><p>The building was almost empty.<\/p><p>He sat at his desk.<\/p><p>The original folder was waiting for him.<\/p><p>THE CASE: UNKNOWN<\/p><p>He opened it.<\/p><p>The first photograph was Alan.<\/p><p>Miller stared at him.<\/p><p>He remembered the first day.<\/p><p>The apartment.<\/p><p>The laptop.<\/p><p>The strange message.<\/p><p>The code.<\/p><p>The question he had written beneath Alan's photograph.<\/p><p>WHY?<\/p><p>He turned the page.<\/p><p>Ryan.<\/p><p>Ethan.<\/p><p>Emily.<\/p><p>Carter.<\/p><p>Reed.<\/p><p>The eleven subjects.<\/p><p>Every person who had become part of the case.<\/p><p>Every person who had been affected by it.<\/p><p>Miller reached the final page.<\/p><p>There was one blank line.<\/p><p>He picked up his pen.<\/p><p>For years, he had written names into files.<\/p><p>Now he wrote the final words himself.<\/p><p>CASE CLOSED.<\/p><p>He stopped.<\/p><p>Then he added:<\/p><p>NO LONGER UNKNOWN.<\/p><p>Miller closed the folder.<\/p><p>He sat quietly for a moment.<\/p><p>There was no unknown number.<\/p><p>No strange message.<\/p><p>No new photograph.<\/p><p>No footsteps outside the office.<\/p><p>Nothing.<\/p><p>Just silence.<\/p><p>The kind of silence that didn't mean danger.<\/p><p>The kind that meant the investigation was finally over.<\/p><p>Miller stood.<\/p><p>He placed the folder in the archive.<\/p><p>Before closing the cabinet, he looked at the cover one last time.<\/p><p>THE CASE: UNKNOWN<\/p><p>He closed the door.<\/p><p>Locked it.<\/p><p>And walked away.<\/p><p>Outside, the city was still awake.<\/p><p>Cars moved through the streets.<\/p><p>People walked beneath the lights.<\/p><p>Somewhere, Ryan Mercer was finally living without being called a killer.<\/p><p>Somewhere, Emily Harper was home.<\/p><p>Somewhere, Ethan Cole was beginning a life that had been taken from him.<\/p><p>Daniel Carter no longer had to disappear.<\/p><p>Thomas Reed no longer had to run.<\/p><p>And Alan Cole's name was finally attached to the truth instead of a lie.<\/p><p>Miller stopped outside the station.<\/p><p>He looked up at the night sky.<\/p><p>For years, he had chased an answer.<\/p><p>He had believed every case had to end with a name.<\/p><p>A suspect.<\/p><p>An arrest.<\/p><p>A confession.<\/p><p>But the truth had been bigger than that.<\/p><p>The real crime had been making people believe the wrong story.<\/p><p>The real victory was exposing it.<\/p><p>Miller turned away from the station.<\/p><p>He walked home.<\/p><p>For the first time in years, he didn't carry a case with him.<\/p><p>Behind him, inside the police station, the final file remained locked in the archive.<\/p><p>The cover was worn.<\/p><p>The pages were full.<\/p><p>But the last page contained only three words.<\/p><p>THE CASE: CLOSED.<\/p><p>The lights in the archive turned off.<\/p><p>The building became quiet.<\/p><p>And for the first time since Alan Cole sent those final messages...<\/p><p>there was no one watching.<\/p><p>No one following.<\/p><p>No one waiting.<\/p><p>The truth had finally been found.<\/p><p>THE CASE: UNKNOWN<\/p><p>CASE CLOSED.<\/p><p><b>THE END<\/b><\/p>", "c": "Ethan Cole"}]}</script>

 `<h2>Copyright</h2><p class="big">THE CASE: UNKNOWN</p><p>Copyright &copy; 2026 The Aceald Com.<br>All rights reserved.</p><p>Written by <b>The Aceald Com</b>.<br>Digital edition made by <b>Malek Ahmed Tharwat</b>.</p><p>First digital edition, 2026.</p>`,

 else if(p.t==='cast')h=ch(`<div class="mid"><h1>The <span>Characters</span></h1><div class="sub">Choose a character to open their chapters</div><div class="cards">${D.chars.map((c,ci)=>`<button class="card" data-sel="${ci}"><div class="badge">${initials(c.name)}</div><h3>${c.name}</h3><p>Chapters ${rng(c)}<br>${D.chs.filter(x=>x.c===c.name).length} chapters</p><u>Choose chapter &#8250;</u></button>`).join('')}</div></div>`,'Before the Story');
 else if(p.t==='sel'){const c=D.chars[p.ci],list=D.chs.filter(x=>x.c===c.name),n=list.length,cols=n>12?6:n>6?4:3;

 else if(p.t==='story')h=ch(`<div class="vp"><div class="txt" style="transform:translateX(${-p.k*1100}px);width:1040px">${p.k===0||true?chHead(p.c)+p.c.html:''}</div></div>`,`Chapter ${p.c.n} &middot; ${p.c.title}`);

 l.innerHTML=h;refreshBm();

 book.innerHTML='';
 P.forEach((p,i)=>{const l=document.createElement('div');l.className='leaf'+(p.t==='cover'?' cover':'');l.style.zIndex=P.length-i;

  book.appendChild(l)});
}
function fillNear(t,r=2){for(let i=Math.max(1,t-r);i<=Math.min(P.length-1,t+r);i++)fill(i)}
function render(t,anim){
 const old=cur,dir=t>old?1:-1,lo=Math.min(old,t),hi=Math.max(old,t),dist=hi-lo,step=Math.min(.06,.7/Math.max(dist,1));
 if(dist<=10)for(let i=lo;i<=hi;i++)fill(i);fillNear(t);
 [...book.children].forEach((l,i)=>{
  if(anim&&i>=lo&&i<hi)l.style.setProperty('--d',((dir>0?i-lo:hi-1-i)*step)+'s');
  l.classList.toggle('flipped',i<t)});
 cur=t;book.classList.toggle('closed',t===0);
 $('#pg').value=t;$('#prev').disabled=t===0;$('#next').disabled=t===P.length-1;
 store.set('tcu-pos',t);$('#bar').style.setProperty('--p',t/Math.max(1,P.length-1));
}
function go(t){t=Math.max(0,Math.min(P.length-1,t|0));if(t!==cur)render(t,true)}
const idxOf=f=>P.findIndex(f);
function refreshBm(){
 document.querySelectorAll('.bm').forEach(b=>b.classList.toggle('on',bms.has(key(P[+b.dataset.i]))));
 $('#bc').textContent=bms.size;
}
function showPanel(){
 const items=[...bms].map(k=>({k,i:idxOf(p=>key(p)===k)})).filter(x=>x.i>0).sort((a,b)=>a.i-b.i);
 $('#pbox').innerHTML=`<h3>Your Bookmarks</h3>`+(items.length?items.map(x=>`<button class="it" data-j="${x.i}"><span>${label(P[x.i])}</span><b>p. ${x.i}</b></button>`).join(''):'<p>No bookmarks yet. Press the red ribbon on any page to add one.</p>')+`<button class="x" id="pc">Close</button>`+(items.length?`<button class="x" id="pclr">Clear all</button>`:'');
 $('#panel').classList.add('show');
}
book.addEventListener('click',e=>{
 const t=e.target.closest('button,.cover');if(!t)return;
 if(t.classList.contains('cover'))return go(1);
 if(t.classList.contains('bm')){const k=key(P[+t.dataset.i]);bms.has(k)?bms.delete(k):bms.add(k);store.set('tcu-bm',[...bms]);return refreshBm()}
 if(t.dataset.sel!=null)return go(idxOf(p=>p.t==='sel'&&p.ci===+t.dataset.sel));
 if(t.dataset.ch)return go(idxOf(p=>p.t==='story'&&p.c.n===+t.dataset.ch&&p.k===0));
 if(t.dataset.go==='cast')return go(idxOf(p=>p.t==='cast'));
});
$('#panel').addEventListener('click',e=>{
 const t=e.target;
 if(t.id==='panel'||t.id==='pc')return $('#panel').classList.remove('show');
 if(t.id==='pclr'){bms.clear();store.set('tcu-bm',[]);refreshBm();return showPanel()}
 const b=t.closest('.it');if(b){$('#panel').classList.remove('show');go(+b.dataset.j)}
});
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#toc').onclick=()=>go(idxOf(p=>p.t==='cast'));$('#bmb').onclick=showPanel;
$('#pg').onchange=e=>go(+e.target.value);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);if(e.key==='Escape')$('#panel').classList.remove('show')});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>70)go(cur+(d<0?1:-1))});
function fit(){const s=Math.min((innerWidth-50)/1230,(innerHeight-62-50)/830);$('#scaler').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
(document.fonts?Promise.all(["400 26px 'Crimson Pro'","italic 400 26px 'Crimson Pro'","700 26px 'Crimson Pro'","700 40px 'Bodoni Moda'","900 40px 'Bodoni Moda'","400 18px 'Special Elite'"].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).catch(()=>{}):Promise.resolve()).then(()=>{
 buildPages();mount();$('#tot').textContent=P.length-1;
 const s=store.get('tcu-pos',0);cur=0;
 render(Math.min(s,P.length-1),false);
 requestAnimationFrame(()=>requestAnimationFrame(()=>book.classList.remove('noanim')));
 refreshBm();
});
</script></body></html>
